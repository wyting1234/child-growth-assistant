<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="儿童成长助手 · 工具导航中心：成长主页 / 学习记录 / 情商club / 时间统计" />
    <meta name="theme-color" content="#2563eb" />
    <title>儿童成长助手 · 导航中心</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray: #64748b;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
            --card-bg: #ffffff;
            --bg: #f1f5f9;
            --text: #1e293b;
            --text-sub: #64748b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text: #f1f5f9;
                --text-sub: #94a3b8;
                --border: #334155;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px 48px;
        }
        #app {
            max-width: 860px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .logo {
            font-size: 52px;
            line-height: 1;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 10px rgba(37, 99, 235, 0.25));
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header .sub {
            font-size: 14px;
            color: var(--text-sub);
        }

        /* ===== TOOL GRID ===== */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (max-width: 560px) {
            .tool-grid {
                grid-template-columns: 1fr;
            }
        }
        .tool-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            position: relative;
            overflow: hidden;
        }
        .tool-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity 0.18s ease;
        }
        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.16);
            border-color: var(--primary-light);
        }
        .tool-card:hover::before {
            opacity: 1;
        }
        .tool-card .ico {
            font-size: 34px;
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.10), rgba(37, 99, 235, 0.04));
            border-radius: 14px;
        }
        .tool-card .info {
            flex: 1;
            min-width: 0;
        }
        .tool-card .name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .tool-card .desc {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
        }
        .tool-card .arrow {
            font-size: 18px;
            color: var(--text-sub);
            opacity: 0.5;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        .tool-card:hover .arrow {
            transform: translateX(4px);
            opacity: 1;
            color: var(--primary);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-sub);
        }
        .footer .back {
            display: inline-block;
            margin-top: 10px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .footer .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="logo">🌱</div>
            <h1>儿童成长助手 · 导航中心</h1>
            <div class="sub">四个工具，一个入口，随时切换</div>
        </div>

        <div class="tool-grid">
            <a class="tool-card" href="./index.html">
                <span class="ico">🌱</span>
                <span class="info">
                    <span class="name">成长主页</span>
                    <span class="desc">全周期学习成长计划：目标管理、每日打卡、周期复盘、成长档案</span>
                </span>
                <span class="arrow">➜</span>
            </a>

            <a class="tool-card" href="./study-record.html">
                <span class="ico">📚</span>
                <span class="info">
                    <span class="name">学习记录</span>
                    <span class="desc">儿童学习记录 · 成长陪伴复盘系统</span>
                </span>
                <span class="arrow">➜</span>
            </a>

            <a class="tool-card" href="./情商club.html">
                <span class="ico">💬</span>
                <span class="info">
                    <span class="name">情商club</span>
                    <span class="desc">人际沟通复盘 · 口才情商迭代</span>
                </span>
                <span class="arrow">➜</span>
            </a>

            <a class="tool-card" href="./时间统计.html">
                <span class="ico">⏱️</span>
                <span class="info">
                    <span class="name">时间统计</span>
                    <span class="desc">柳比歇夫时间管理法：计时、记录、统计、复盘</span>
                </span>
                <span class="arrow">➜</span>
            </a>
        </div>

        <div class="footer">
            <div>🌱 儿童成长助手 · child-growth-assistant</div>
            <a class="back" href="./index.html">← 返回成长主页</a>
        </div>
    </div>
</body>
</html>
