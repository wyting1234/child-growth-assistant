const lessonFilter = { moduleId:'', type:'', status:'', mastered:'', from:'', to:'', q:'' };

function filteredLessons(){
  return state.lessons.filter(l => {
    if(lessonFilter.moduleId && l.moduleId !== lessonFilter.moduleId) return false;
    if(lessonFilter.type && l.type !== lessonFilter.type) return false;
    if(lessonFilter.status && l.status !== lessonFilter.status) return false;
    if(lessonFilter.mastered !== '' && String(!!l.mastered) !== lessonFilter.mastered) return false;
    if(lessonFilter.from && l.date < lessonFilter.from) return false;
    if(lessonFilter.to && l.date > lessonFilter.to) return false;
    if(lessonFilter.q){
      const q = lessonFilter.q.toLowerCase();
      const hay = [l.title, l.note, (l.detailItems||[]).map(d=>d.value).join(' '), (l.contents||[]).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => (b.date + String(b.slot ? tblSlots().indexOf(b.slot) : 99) + (b.time||''))
                 .localeCompare(a.date + String(a.slot ? tblSlots().indexOf(a.slot) : 99) + (a.time||'')));
}

/* ==================== 闪卡 ==================== */
function rateCard(id, grade){
  const c = state.cards.find(x => x.id === id);
  if(!c) return;
  if(grade === 0){ c.interval = 0; c.reps = 0; c.due = todayStr(); }
  else if(grade === 1){ c.reps++; c.interval = c.interval ? Math.max(1, Math.round(c.interval * 1.5)) : 1; c.due = addDays(todayStr(), c.interval); }
  else { c.reps++; c.interval = c.interval ? Math.max(2, Math.round(c.interval * 2.5)) : 2; c.due = addDays(todayStr(), c.interval); }
  if(cardQueue) cardQueue = cardQueue.filter(x => x !== id);
  save(); cardFlipped = false; renderCards();
}

  v.innerHTML = `

    <div class="panel">
      <h4>➕ 添加学习目标 / 知识点</h4>
      <div class="form-grid">
        <label class="fld"><span>所属模块</span>
          <select id="gl-module">${state.modules.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
        </label>
        <label class="fld"><span>难度</span>
          <select id="gl-level"><option>基础</option><option>提升</option><option>拔高</option></select>
        </label>
        <label class="fld span2"><span>知识点名称</span><input id="gl-title" placeholder="例如：二次函数最值问题"></label>
        <label class="fld span2"><span>说明</span><input id="gl-desc" placeholder="补充说明（可选）"></label>
      </div>
      <div style="margin-top:10px"><button class="btn primary" data-action="goal-add">添加</button></div>
    </div>

    ${state.modules.map(m => {
      const gs = state.goals.filter(g => g.moduleId === m.id);
      if(!gs.length) return '';
      return `<h4 class="sec" style="margin-top:18px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${m.color}"></span>${esc(m.name)}（${gs.length}）</h4>
      <div class="goal-grid">
        ${gs.map(g => {
          const used = state.lessons.filter(l => l.goalId === g.id);
          const mastered = used.filter(l => l.mastered).length;
          return `<div class="goal-card" style="--c:${m.color}">
            <div class="gt">${esc(g.title)}</div>
            <div class="gd">${esc(g.desc || '—')}</div>
            <div class="gm">
              <span class="tag">${g.level}</span>
              <span>已安排 ${used.length} 节</span>
              <span>掌握 ${mastered}</span>
            </div>
            <div class="go">
              <button class="btn xs primary" data-action="goal-plan" data-id="${g.id}">加入日历</button>
              <button class="btn xs ghost danger" data-action="goal-del" data-id="${g.id}">删除</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('') || '<div class="empty">还没有学习目标，先在上方添加吧</div>'}
  `;
}

/* ==================== 模块管理 ==================== */
function renderModules(){
  const v = document.getElementById('view');
  v.innerHTML = `
    <h2 class="page-title">🧩 模块管理 <span class="sub">语文 / 数学 / 英语…可自由增删</span></h2>

    <div class="panel">
      <h4>➕ 新增模块</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="md-name" placeholder="模块名称，例如：物理" style="flex:1;min-width:160px;font-family:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;outline:none">
        <input type="color" id="md-color" value="#8b5cf6" style="width:46px;height:36px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:#fff">
        <button class="btn primary" data-action="mod-add">添加模块</button>
      </div>
    </div>

    <div class="mod-list">
      ${state.modules.map(m => {
        const cnt = state.lessons.filter(l => l.moduleId === m.id).length;
        const gc = state.goals.filter(g => g.moduleId === m.id).length;
        const mc = state.lessons.filter(l => l.moduleId === m.id && l.mastered).length;
        const dur = state.lessons.filter(l => l.moduleId === m.id).reduce((s,l)=>s+(l.duration||0),0);
        return `<div class="mod-item">
          <span class="swatch" style="background:${m.color}"></span>
          <span class="nm">${esc(m.name)}</span>
          <span class="meta">课时 ${cnt} · 目标 ${gc} · 掌握 ${mc} · 总时长 ${dur}分</span>
          <span class="spacer"></span>
          <button class="btn xs ghost danger" data-action="mod-del" data-id="${m.id}">删除</button>
        </div>`;
      }).join('') || '<div class="empty">还没有模块</div>'}
    </div>
  `;
}

/* ==================== 统计分析 ==================== */
function renderStats(){
  const v = document.getElementById('view');
  const t = todayStr();

  let ls = state.lessons.slice();
  if(statsFrom || statsTo){
    if(statsFrom) ls = ls.filter(l => l.date >= statsFrom);
    if(statsTo)   ls = ls.filter(l => l.date <= statsTo);
  }else{
    if(statsRange === 'week'){
      const s = startOfWeek(t);
      ls = ls.filter(l => l.date >= s && l.date <= addDays(s, 6));
    }else if(statsRange === 'month'){
      const d = new Date();
      const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
      ls = ls.filter(l => l.date >= s);
    }
  }

  const total = ls.length;
  const done = ls.filter(l => l.status === '已完成').length;
  const part = ls.filter(l => l.status === '部分完成').length;
  const none = total - done - part;
  const mastered = ls.filter(l => l.mastered).length;
  const masterRate = total ? Math.round(mastered / total * 100) : 0;
  const inClass = ls.filter(l => l.type === '课内').length;
  const outClass = total - inClass;
  const totalDur = ls.reduce((s,l) => s + (l.duration||0), 0);
  const avgDur = total ? Math.round(totalDur / total) : 0;

  const perModule = state.modules.map(m => {
    const ml = ls.filter(l => l.moduleId === m.id);
    return {
      m, count: ml.length,
      mastered: ml.filter(l => l.mastered).length,
      done: ml.filter(l => l.status === '已完成').length,
      duration: ml.reduce((s,l)=>s+(l.duration||0),0)
    };
  });
  const maxCount = Math.max(1, ...perModule.map(x => x.count));

  /* 课表安排（计划侧）：每周课内 / 课外节数 + 课外单科分布 */
  const kc = tblKindCounts();
  const outSubs = tblOutSubjects();
  const weekIn = kc.in, weekOut = kc.out, weekTot = weekIn + weekOut;
  const maxOut = Math.max(1, ...outSubs.map(s => s.count));

  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = addDays(t, -i);
    days.push({ d, n: state.lessons.filter(l => l.date === d).length });
  }
  const maxDay = Math.max(1, ...days.map(x => x.n));

  const todoTotal = state.todos.length;
  const todoDone = state.todos.filter(x => x.done).length;
  const todoRate = todoTotal ? Math.round(todoDone / todoTotal * 100) : 0;
  const dueCards = state.cards.filter(c => !c.due || c.due <= t).length;

  const rangeLabel = (statsFrom || statsTo)
    ? `${statsFrom || '最早'} 至 ${statsTo || '最新'}`
    : {all:'全部',week:'本周',month:'本月'}[statsRange];

  v.innerHTML = `
    <h2 class="page-title">📊 统计分析
      <span class="sub">范围：${esc(rangeLabel)}　·　${total} 节 / ${totalDur} 分钟</span>
    </h2>

    <div class="filter-bar" style="padding:10px 12px;gap:10px;">
      <div class="seg">
        ${[['all','全部'],['month','本月'],['week','本周']].map(([k,label]) =>
          `<button class="${(!statsFrom && !statsTo && statsRange===k)?'active':''}" data-action="stat-range" data-range="${k}">${label}</button>`).join('')}
      </div>
      <span style="font-size:12.5px;color:var(--muted);margin-left:6px;">自定义：</span>
      <input type="date" id="st-from" value="${statsFrom}" title="起始日期" style="font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:#fcfcfe;outline:none">
      <span class="muted">至</span>
      <input type="date" id="st-to" value="${statsTo}" title="结束日期" style="font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:#fcfcfe;outline:none">
      <button class="btn primary" id="st-apply">应用</button>
      <button class="btn" id="st-reset">重置</button>
    </div>

    <div class="stat-cards">
      <div class="stat-card"><span>课时总数</span><b>${total}</b></div>
      <div class="stat-card"><span>已完成</span><b style="color:var(--ok)">${done}</b></div>
      <div class="stat-card"><span>部分完成</span><b style="color:var(--warn)">${part}</b></div>
      <div class="stat-card"><span>未完成</span><b style="color:var(--bad)">${none}</b></div>
      <div class="stat-card"><span>掌握率</span><b style="color:var(--primary)">${masterRate}%</b></div>
      <div class="stat-card"><span>总学习时长</span><b>${totalDur}<small style="font-size:12px;color:var(--muted);font-weight:400"> 分</small></b></div>
      <div class="stat-card"><span>平均每节</span><b>${avgDur}<small style="font-size:12px;color:var(--muted);font-weight:400"> 分</small></b></div>
      <div class="stat-card"><span>待复习闪卡</span><b>${dueCards}</b></div>
    </div>

    <div class="panel">
      <h4>📚 各模块课时分布（含时长）</h4>
      ${perModule.map(x => `
        <div class="stat-row">
          <span class="lbl" title="${esc(x.m.name)}">${esc(x.m.name)}</span>
          <div class="bar2"><i style="width:${Math.round(x.count / maxCount * 100)}%;background:${x.m.color}"></i></div>
          <span class="val">${x.count} 节 · ${x.duration}分 · 掌握 ${x.mastered}</span>
        </div>`).join('') || '<div class="empty">暂无数据</div>'}
    </div>

    <div class="panel">
      <h4>🏫 课内 / 课外占比</h4>
      <div class="stat-row">
        <span class="lbl">课内</span>
        <div class="bar2"><i style="width:${total ? Math.round(inClass/total*100) : 0}%;background:#6366f1"></i></div>
        <span class="val">${inClass} 节 (${total ? Math.round(inClass/total*100) : 0}%)</span>
      </div>
      <div class="stat-row">
        <span class="lbl">课外</span>
        <div class="bar2"><i style="width:${total ? Math.round(outClass/total*100) : 0}%;background:#ec4899"></i></div>
        <span class="val">${outClass} 节 (${total ? Math.round(outClass/total*100) : 0}%)</span>
      </div>
    </div>

    <div class="panel">
      <h4 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">🗓 课表安排（每周计划）
        <span class="muted" style="font-weight:400;font-size:12px">课内 ${weekIn} 节 · 课外 ${weekOut} 节 · 有效周期 ${esc(timetablePeriodLabel())}</span>
        <span class="spacer"></span>
        <button class="btn xs" data-action="tbl-import">📘 课内课表</button>
        <button class="btn xs" style="border-color:#f9a8d4;color:#be185d" data-action="tbl-import-out">🎹 课外单科</button>
      </h4>
      ${weekTot ? `
      <div class="stat-row">
        <span class="lbl">📘 课内</span>
        <div class="bar2"><i style="width:${Math.round(weekIn/weekTot*100)}%;background:#6366f1"></i></div>
        <span class="val">${weekIn} 节 / 周 (${Math.round(weekIn/weekTot*100)}%)</span>
      </div>
      <div class="stat-row">
        <span class="lbl">🎹 课外</span>
        <div class="bar2"><i style="width:${Math.round(weekOut/weekTot*100)}%;background:#ec4899"></i></div>
        <span class="val">${weekOut} 节 / 周 (${Math.round(weekOut/weekTot*100)}%)</span>
      </div>` : '<div class="empty">课表还是空的，去「课程设计」粘贴课内 / 课外课表</div>'}
      ${outSubs.length ? `
      <div style="margin-top:12px;font-size:12px;color:var(--muted);font-weight:600">课外单科分布</div>
      ${outSubs.map(s => `
        <div class="stat-row">
          <span class="lbl" title="${esc(s.subject)}">🎹 ${esc(s.subject)}</span>
          <div class="bar2"><i style="width:${Math.round(s.count/maxOut*100)}%;background:#ec4899"></i></div>
          <span class="val">${s.count} 节 / 周 · 周${s.days.slice().sort((a,b)=>a-b).map(d => WD[d-1]).join('、')}</span>
        </div>`).join('')}` : ''}
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px">上面是课表（计划），上面两张卡片是实际记录的完成情况。课内、课外共用同一张课表，因此统计口径一致。</div>
    </div>

    <div class="panel">
      <h4>📈 近 7 天课时量</h4>
      <div class="days">
        ${days.map(x => {
          const dt = parseDate(x.d);
          return `<div class="dcol">
            <div class="dnum">${x.n || ''}</div>
            <div class="dbar" style="height:${x.n ? Math.max(6, Math.round(x.n / maxDay * 72)) : 3}px;${x.n ? '' : 'background:#e9ecf5'}"></div>
            <div class="dlab">${dt.getMonth()+1}/${dt.getDate()}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="panel">
      <h4>✅ 待办与目标</h4>
      <div class="stat-row">
        <span class="lbl">待办完成</span>
        <div class="bar2"><i style="width:${todoRate}%;background:linear-gradient(90deg,#34d399,#10b981)"></i></div>
        <span class="val">${todoDone}/${todoTotal} (${todoRate}%)</span>
      </div>
      <div class="stat-row">
        <span class="lbl">目标覆盖</span>
        <div class="bar2"><i style="width:${state.goals.length ? Math.round(state.goals.filter(g => state.lessons.some(l => l.goalId === g.id)).length / state.goals.length * 100) : 0}%;background:linear-gradient(90deg,#fbbf24,#f59e0b)"></i></div>
        <span class="val">${state.goals.filter(g => state.lessons.some(l => l.goalId === g.id)).length}/${state.goals.length} 个知识点已安排</span>
      </div>
    </div>
  `;

  document.getElementById('st-apply').addEventListener('click', () => {
    statsFrom = document.getElementById('st-from').value;
    statsTo = document.getElementById('st-to').value;
    statsRange = 'all';
    renderStats();
  });
  document.getElementById('st-reset').addEventListener('click', () => {
    statsFrom = ''; statsTo = ''; statsRange = 'all';
    renderStats();
  });
}

/* ==================== 启动 ==================== */
render();
renderChildBar();
if(claimedLegacy) flashTip('已把原有课时数据归到「' + curChild() + '」名下');
</script>
