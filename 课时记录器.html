<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="儿女学习时光">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>儿女学习时光 · 课时记录器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#e8ebf0;
  --primary:#4f46e5;--primary-soft:#eef2ff;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -16px rgba(16,24,40,.25);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}

.sidebar{background:#fff;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:6px 10px 16px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.sidebar nav{display:flex;flex-direction:column;gap:3px}
.sidebar nav button{display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;
  padding:9px 11px;border-radius:10px;font-size:13.5px;color:#374151;cursor:pointer;font-family:inherit;transition:.15s}
.sidebar nav button:hover{background:#f6f7fb}
.sidebar nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.sidebar .foot{margin-top:16px;padding:10px;font-size:11px;color:var(--muted);border-top:1px dashed var(--border)}
  /* 学员切换：课时数据按学员隔离（键名前缀「<学员名>::」）。
     这里只切换「当前是谁」，增删学员仍归导航中心 —— 不重复造一套账户管理。 */
  .child-bar{display:flex;align-items:center;gap:6px;padding:0 10px 12px}
  .child-bar[hidden]{display:none}
  .child-bar label{font-size:11px;color:var(--muted);white-space:nowrap}
  .child-bar select{flex:1;min-width:0;font-family:inherit;font-size:12px;padding:5px 7px;
    border:1px solid var(--border);border-radius:8px;background:#fff;color:inherit;cursor:pointer}
  .child-hint{font-size:10.5px;line-height:1.5;color:var(--muted);padding:0 10px 10px;margin:0}
  .child-hint.warn{color:#92400e;background:#fffbeb;border:1px solid #fde68a;
    border-radius:8px;padding:5px 8px;margin:0 10px 10px}
  .child-hint[hidden]{display:none}
  .lr-tip{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-8px);
    z-index:9999;background:#111827;color:#fff;font-size:12.5px;line-height:1.5;
    padding:9px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);
    max-width:80vw;text-align:center;opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s}
  .lr-tip.show{opacity:1;transform:translateX(-50%) translateY(0)}

main{padding:20px 22px 60px;min-width:0}
h2.page-title{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2.page-title .sub{font-size:12px;color:var(--muted);font-weight:400}

.btn{font-family:inherit;font-size:13px;padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:#fff;color:#374151;cursor:pointer;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:#f7f8fc;border-color:#d5d9e2}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn.danger{color:var(--bad);border-color:#fecaca;background:#fff}
.btn.danger:hover{background:#fef2f2}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#f3f4f8}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:7px}
.btn.success{background:#10b981;border-color:#10b981;color:#fff}
.btn.success:hover{background:#059669}
.spacer{flex:1}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;background:#fafbfe;border-radius:10px;border:1px dashed var(--border)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:99px;background:#f1f3f9;color:#4b5563}
.tag.ok{background:#e7f8f1;color:#047857}
.tag.warn{background:#fef4e2;color:#b45309}
.tag.bad{background:#fdecec;color:#b91c1c}
.tag.in{background:#eef2ff;color:#4338ca}
.tag.out{background:#fdf2f8;color:#9d174d}
.tag.goal{background:#fff7ed;color:#c2410c}
.tag.muted{background:#f3f4f6;color:#9ca3af}
.tag.cat{background:#e0f2fe;color:#0369a1}

.cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:15px;font-weight:600;min-width:150px}
.cal-nav{display:flex;gap:4px}
.seg{display:flex;background:#eef0f6;border-radius:9px;padding:3px}
.seg button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:4px 12px;border-radius:7px;cursor:pointer;color:#4b5563}
.seg button.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-cell{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:98px;padding:6px;
  display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.15s;overflow:hidden}
.cal-cell:hover{border-color:#c7cdf7;box-shadow:0 0 0 3px var(--primary-soft)}
.cal-cell.muted{opacity:.42}
.cal-cell.today{border-color:var(--primary);background:linear-gradient(180deg,#fff,#f8f8ff)}
.cal-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.cal-count{background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:0 6px;font-size:10.5px;font-weight:600}
.cal-items{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-chip{font-size:11px;padding:2px 5px;border-radius:6px;background:#f6f7fb;color:#374151;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c,#999)}
.cal-more{font-size:10.5px;color:var(--muted);padding-left:4px}
.cal-todo{font-size:11px;color:var(--warn);margin-top:auto}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week-col{background:var(--panel);border:1px solid var(--border);border-radius:11px;display:flex;flex-direction:column;min-height:220px;overflow:hidden}
.week-col.today{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.week-head{display:flex;align-items:center;gap:5px;padding:8px 9px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer}
.week-head b{color:var(--text);font-size:13px}
.week-head .mini-add{margin-left:auto;border:0;background:#f1f3f9;color:var(--primary);width:20px;height:20px;
  border-radius:6px;cursor:pointer;font-size:14px;line-height:1;font-family:inherit}
.week-body{padding:7px;display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
.lcard{border-radius:9px;padding:7px 8px;background:#fafbff;border-left:3px solid var(--c,#999);cursor:pointer;transition:.15s}
.lcard:hover{background:#f2f4ff}
.lcard-top{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#374151}
.lcard-top .time{margin-left:auto;color:var(--muted);font-size:11px}
.lcard-title{font-size:12.5px;font-weight:600;margin:3px 0 4px;word-break:break-word}
.lcard-tags{display:flex;gap:4px;flex-wrap:wrap}
.empty-mini{font-size:11.5px;color:#b8bcc7;text-align:center;padding:10px 0}
.week-todo{font-size:11.5px;color:#b45309;background:#fffbeb;border-radius:7px;padding:4px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#modal-root{display:none}
#modal-root.open{display:block}
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:60;display:flex;justify-content:center;
  align-items:flex-start;padding:34px 16px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:700px;padding:18px 20px 16px;
  box-shadow:0 24px 60px -20px rgba(16,24,40,.4);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;margin-bottom:14px}
.modal-head h3{font-size:16px}
.modal-head .btn{margin-left:auto}
.modal-foot{display:flex;gap:8px;margin-top:16px;align-items:center;padding-top:12px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld.span2{grid-column:span 2}
.fld input,.fld select,.fld textarea{font-family:inherit;font-size:13.5px;color:var(--text);padding:8px 10px;
  border:1px solid var(--border);border-radius:9px;background:#fcfcfe;outline:none;transition:.15s;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.fld.chk{flex-direction:row;align-items:center;gap:6px;color:var(--text);font-size:13px}
.fld.chk input{width:auto}
h4.sec{font-size:13px;color:#374151;margin:16px 0 8px;display:flex;align-items:center;gap:6px}

.pull-area{background:#f8f9fd;border-radius:12px;padding:14px;margin-top:14px;border:1px dashed #c7cdf7}
.pull-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.pull-header b{font-size:14px;color:var(--primary)}
.detail-group{margin-bottom:10px;background:#fff;border-radius:9px;padding:8px 12px;border:1px solid var(--border)}
.dg-head{font-size:12.5px;font-weight:600;color:#4338ca;margin-bottom:6px;display:flex;align-items:center;gap:5px}

/* 知识点条目 */
.dg-items{display:flex;flex-direction:column;gap:5px}
.detail-item{display:flex;align-items:center;gap:4px;background:#fafbff;border-radius:8px;padding:3px 4px;border:1px solid #e5e7eb;transition:.12s}
.detail-item:hover{border-color:#a5b4fc;background:#fff}
.detail-item .detail-chip{flex:1;display:flex;align-items:center;gap:7px;background:transparent;border:0;border-radius:6px;
  padding:5px 8px;cursor:pointer;font-size:12.5px;color:#374151;transition:.12s;user-select:none;text-align:left}
.detail-item .detail-chip input{display:none}
.detail-item .detail-chip .check-mark{width:15px;height:15px;border-radius:4px;border:1.5px solid #d1d5db;display:inline-flex;
  align-items:center;justify-content:center;font-size:10px;color:#fff;transition:.12s;flex-shrink:0}
.detail-item .detail-chip.on .check-mark{background:var(--primary);border-color:var(--primary)}
.detail-item .detail-chip.on .check-mark::before{content:'✓'}
.detail-item .detail-chip.on{color:var(--primary);font-weight:600}
.detail-item .detail-chip.on::before{content:none !important}
.quick-btn{width:26px;height:26px;border:0;background:#eef2ff;color:#4f46e5;border-radius:6px;cursor:pointer;
  font-size:13px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0}
.quick-btn:hover{background:var(--primary);color:#fff}
.quick-btn:disabled{background:#10b981;color:#fff;cursor:default}
.pull-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding-top:12px}

.day-check{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day-check .cc{background:#f8f9fd;border-radius:10px;padding:8px 10px;text-align:center}
.day-check .cc span{display:block;font-size:11px;color:var(--muted)}
.day-check .cc b{font-size:17px}
.bar{height:6px;border-radius:99px;background:#eef0f6;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#10b981);border-radius:99px;transition:width .3s}
.day-actions{display:flex;gap:8px;margin-top:12px}
.day-lessons{display:flex;flex-direction:column;gap:9px}
.day-lesson{background:#fafbff;border-radius:11px;padding:10px 12px;border-left:4px solid var(--c,#999)}
.dl-head{display:flex;align-items:center;gap:6px;font-size:12.5px;flex-wrap:wrap}
.dl-title{font-weight:600;margin:5px 0 7px;font-size:13.5px}
.dl-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dl-controls select,.dl-controls input[type=text],.dl-controls .note-input{font-family:inherit;font-size:12.5px;
  padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;outline:none}
.dl-controls .grow{flex:1;min-width:140px}
.todo-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:#fafbff;margin-bottom:5px;font-size:13px}
.todo-row.done span{text-decoration:line-through;color:var(--muted)}
.todo-row em{margin-left:auto;font-style:normal}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;margin-bottom:14px}
.filter-bar select,.filter-bar input{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);
  border-radius:8px;background:#fcfcfe;outline:none;color:var(--text)}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--primary);background:#fff}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start;transition:.15s}
.rec:hover{box-shadow:var(--shadow)}
.rec .cdot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.rec .body{flex:1;min-width:0}
.rec .r1{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rec .r2{font-weight:600;font-size:14px;margin:3px 0 5px;word-break:break-word}
.rec .r3{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec .note{font-size:12.5px;color:#6b7280;margin-top:6px;background:#f8f9fd;padding:6px 9px;border-radius:8px}
.rec .ops{display:flex;gap:4px;flex:0 0 auto}
.detail-mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.detail-mini .dm{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef2ff;color:#4338ca}

.todo-add{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.todo-add input[type=text]{flex:1;min-width:180px}
.todo-add input,.todo-add select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:#fcfcfe;outline:none}
.todo-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.todo-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.todo-item .txt{flex:1;font-size:13.5px}
.todo-item.done .txt{text-decoration:line-through;color:#9ca3af}
.pri{font-size:11px;padding:1px 7px;border-radius:99px}
.pri.高{background:#fdecec;color:#b91c1c}
.pri.中{background:#fef4e2;color:#b45309}
.pri.低{background:#eef2ff;color:#4338ca}

.flash-wrap{max-width:620px;margin:0 auto}
.flash-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:34px 28px;text-align:center;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;border:1px solid var(--border)}
.flash-front{font-size:20px;font-weight:600;line-height:1.6}
.flash-back{font-size:16px;color:#374151;line-height:1.7;padding-top:14px;border-top:1px dashed var(--border);white-space:pre-wrap}
.flash-ops{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.flash-progress{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-card span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.stat-card b{font-size:23px;letter-spacing:-.5px}
.panel{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px 17px;margin-bottom:14px}
.panel h4{font-size:13.5px;margin-bottom:12px;color:#374151}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.stat-row .lbl{width:70px;flex:0 0 auto;color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-row .bar2{flex:1;height:16px;background:#f1f3f9;border-radius:8px;overflow:hidden}
.stat-row .bar2 i{display:block;height:100%;border-radius:8px;transition:width .4s}
.stat-row .val{width:130px;flex:0 0 auto;text-align:right;color:var(--muted);font-size:12px}
.days{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}
.days .dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.days .dbar{width:100%;max-width:38px;background:linear-gradient(180deg,#818cf8,#4f46e5);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .4s}
.days .dlab{font-size:11px;color:var(--muted)}
.days .dnum{font-size:11px;color:#4b5563;font-weight:600}

.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.goal-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 13px;border-top:3px solid var(--c,#ccc)}
.goal-card .gt{font-weight:600;font-size:14px;margin-bottom:3px}
.goal-card .gd{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:8px}
.goal-card .gm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:9px}
.goal-card .go{display:flex;gap:6px}

.mod-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.mod-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 13px}
.mod-item .swatch{width:16px;height:16px;border-radius:5px}
.mod-item .nm{font-weight:600}
.mod-item .meta{font-size:12px;color:var(--muted)}

.cat-toolbar{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cat-toolbar select{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:#fcfcfe;outline:none}
.cat-card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--primary)}
.cat-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.cat-head .title{font-size:15px;font-weight:700}
.cat-head .path{font-size:12px;color:var(--muted);background:#f1f3f9;border-radius:99px;padding:2px 10px}
.cat-head .spacer{flex:1}
.cat-subjects{padding-left:4px}
.cat-subject{background:#fafbff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #c7cdf7}
.cat-subject .cs-name{font-weight:600;font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cat-unit{border-left:2px solid #eef0f6;padding-left:12px;margin-left:5px;margin-bottom:8px}
.cat-unit .cu-name{font-size:12.5px;font-weight:600;color:#4b5563;margin-bottom:5px}
.cat-lesson{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:5px;border-left:3px solid #e0e7ff}
.cat-lesson .cl-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap}

/* ============ 与全站统一导航（site-nav.js）对接 ============

   默认贴在 left:0 —— 会正好压住这个导航栏。桌面上把它右移一个导航栏的宽度，
   既保住站内「汉堡按钮位置固定」的直觉，也不遮挡工具自身的菜单。
   窄屏（<=900px）时本页导航栏变成顶部横条，不再有左列，悬浮标签回到 left:0。
   ID 选择器优先级高于 site-nav.js 的 .snav-btn，加载先后不影响结果。 */

</style>
</head>
<body>

<!-- 写入时间埋点：backup-hub.js 在**加载时**就给 localStorage.setItem 打钩，
     把每个键的最后写入时间记进 __hub_meta_v1__（不依赖 initHub，页面上不会多出任何 UI）。
     全站同源共用一份 localStorage，所以每一页的写入都必须被记下来 —— 否则云端同步
     在判新旧时只能把「无时间戳」当成「本机刚写过」，取不回另一台设备的较新值。
     这里只引入埋点，不 mount()：备份与同步的入口仍统一在导航中心。 -->
<script src="./backup-hub.js"></script>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-name">📚 课时记录器</span><small>Lesson Recorder</small></div>
    <!-- 学员切换：课时数据按学员隔离。身份键 child_account_current 与
         导航中心 / 成长复盘共用，所以在哪一页换人，全站换的都是同一位。 -->
    <div class="child-bar" id="childBar" hidden>
      <label for="childSel">👦 学员</label>
      <select id="childSel" title="切换学员：每位学员的课时数据分开保存"></select>
    </div>
    <div class="child-hint" id="childHint" hidden></div>
    <nav>
      <button data-view="calendar" class="active">📅 日历 / 周历</button>
      <button data-view="curriculum">📐 课程设计</button>
      <button data-view="lessons">📝 课时记录</button>
      <button data-view="todos">✅ 待办清单</button>
      <button data-view="cards">🎴 复习闪卡</button>
      <button data-view="goals">🎯 学习目标库</button>
      <button data-view="stats">📊 统计分析</button>
    </nav>
    <div class="foot">
      <!-- 站点入口：本页自带侧栏，是全站抽屉之外常驻可见的一条回路。
           两者都只做跳转 —— 全站只有导航中心（index.html）跑同步引擎，
           子页再挂一套实现只会多出一个云端副本、多一套合并策略。 -->
      <button class="foot-link" id="lrGoHome">🧭 返回导航中心</button>
      <button class="foot-link" id="lrGoSync">☁️ 云端同步</button>
      <div style="font-weight:600;color:#4b5563;letter-spacing:.2px;margin-top:10px">课时记录器：V20261012 AE</div>
      <div style="margin-top:2px">导航：V20261012 ae</div>
      <div style="margin-top:6px">数据保存在本机浏览器 · 建议定期备份</div>
    </div>
  </aside>
  <main><section id="view"></section></main>
</div>
<div id="modal-root"></div>

<script>
/* ==================== 基础工具 ==================== */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function startOfWeek(s){ const d=parseDate(s); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return fmtDate(d); }
function weekDays(cursor){ const s=startOfWeek(cursor); return Array.from({length:7},(_,i)=>addDays(s,i)); }
function monthMatrix(cursor){
  const d = parseDate(cursor);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last  = new Date(d.getFullYear(), d.getMonth()+1, 0);
  const start = startOfWeek(fmtDate(first));
  const endWeekStart = startOfWeek(fmtDate(last));
  const total = Math.round((parseDate(endWeekStart) - parseDate(start))/86400000) + 7;
  return Array.from({length: total}, (_, i) => addDays(start, i));
}
const WD = ['一','二','三','四','五','六','日'];

/* ==================== 详情类型映射 ==================== */
const DETAIL_LABELS = {
  goals:'🎯 学习目标', contents:'📖 学习内容', chars:'🈶 生字词',
  words:'🔤 单词', grammar:'📐 语法', methods:'🔧 方法',
  recite:'📜 背诵', sentences:'💬 句型', formulas:'🧮 公式',
  experiments:'🧪 实验', points:'💡 考点', other:'📌 其他'
};
const DETAIL_KEY_MAP = {
  '目标':'goals','学习目标':'goals',
  '内容':'contents','学习内容':'contents',
  '生字':'chars','字词':'chars','词语':'chars','生字词':'chars','生字新词':'chars',
  '单词':'words','词汇':'words','核心词汇':'words','重点单词':'words',
  '语法':'grammar','语法点':'grammar','语法项':'grammar',
  '方法':'methods','解题方法':'methods','学习方法':'methods','技巧':'methods',
  '背诵':'recite','背诵内容':'recite','默写':'recite',
  '句型':'sentences','句式':'sentences','核心句型':'sentences',
  '公式':'formulas','定理':'formulas',
  '实验':'experiments',
  '考点':'points','重点':'points','难点':'points',
  '其他':'other','说明':'other'
};
function splitList(s){
  return String(s).split(/[、，,;；\s]+/).map(x=>x.trim()).filter(Boolean);
}

/* ==================== 状态管理 ==================== */
/* 数据按「学员」隔离，与站内其它记录类数据同一套约定：键名前加「<学员名>::」前缀。
 * 当前学员取自全局键 child_account_current —— 导航中心、成长复盘、本工具共用同一份身份，
 * 所以在这一页换人，全站换的都是同一位；也正因如此，导航中心的「删除学员」能靠
 * `学员名::` 前缀把本工具的数据一并清掉，不会留孤儿数据。
 * 未指定学员时退回无前缀的裸键 —— 与首页 Storage.rk() 的行为对称。 */
const KEY = 'lesson_recorder_v3';
const ACCOUNT_CUR  = 'child_account_current';
const ACCOUNT_LIST = 'child_account_list';
let state;
let loadedChild = curChild();   // 当前这份 state 属于谁（'' = 未指定）

function curChild(){
  try{ return String(localStorage.getItem(ACCOUNT_CUR) || '').trim(); }catch(e){ return ''; }
}
function childList(){
  try{
    const v = JSON.parse(localStorage.getItem(ACCOUNT_LIST) || '[]');
    return (Array.isArray(v) ? v : []).map(x => String(x ?? '').trim()).filter(Boolean);
  }catch(e){ return []; }
}
function setCurChild(name){
  try{
    if(name) localStorage.setItem(ACCOUNT_CUR, name);
    else localStorage.removeItem(ACCOUNT_CUR);
  }catch(e){}
}
/* 每次读写都实时解析，绝不缓存：学员可能在别的页 / 别的标签被切过，
 * 缓存下来的话，换完人还会继续往旧的那位身上写。 */
function dataKey(){
  const c = curChild();
  return c ? (c + '::' + KEY) : KEY;
}
/* 认领历史数据：本改造之前，整份数据放在无前缀的 lesson_recorder_v3 里。
 * 第一个被指定的学员把它接手，原键随即删除 —— 不删的话，换到另一位学员
 * 又会被认领一次，等于所有人抢同一份数据。因此最多只会发生一次。 */
function claimLegacyData(){
  const c = curChild();
  if(!c) return false;
  let legacy = null;
  try{ legacy = localStorage.getItem(KEY); }catch(e){}
  if(legacy == null) return false;
  try{ if(localStorage.getItem(c + '::' + KEY) != null) return false; }catch(e){ return false; }
  try{
    localStorage.setItem(c + '::' + KEY, legacy);
    localStorage.removeItem(KEY);
  }catch(e){ return false; }
  return true;
}

/* ==================== 课程表结构：天 × 节次 ==================== */
/* 一节课 = 某个「星期几」的某个「节次」上什么学科；节次按 早自习 / 上午N / 下午N / 晚自习 排列 */
const TBL_DEFAULT_SLOTS = ['早自习','上午1','上午2','上午3','上午4','下午1','下午2','下午3','晚自习'];
const TBL_GROUP_KEYS = {
  '早自习':'早自习','早读':'早自习','早修':'早自习','晨读':'早自习','晨课':'早自习',
  '上午':'上午','早上':'上午','午前':'上午',
  '下午':'下午','午后':'下午',
  '晚自习':'晚自习','晚修':'晚自习','晚上':'晚自习','晚辅导':'晚自习','夜自习':'晚自习'
};
function emptyTimetable(){ return { slots: TBL_DEFAULT_SLOTS.slice(), grid: {} }; }
function isNoneWord(p){
  const t = String(p || '').trim();
  if(!t) return true;
  if(/^[—\-–~·.、\/\\*×]+$/.test(t)) return true;
  return /^(无|无课|没有|空|空课|休息|放假|none|nil|null|x)$/i.test(t);
}
function cnNum(d){
  const map = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
  if(/^\d+$/.test(d)) return Number(d);
  return map[d] || d;
}
/* 把各种写法归一成节次名：第一节→第1节，早读→早自习，上午第一节→上午1 */
function normalizeSlotName(s){
  let t = String(s || '').trim();
  if(!t) return '';
  if(TBL_GROUP_KEYS[t]) return TBL_GROUP_KEYS[t];
  let m = t.match(/^第\s*([一二三四五六七八九十\d]+)\s*节$/);
  if(m) return '第' + cnNum(m[1]) + '节';
  m = t.match(/^(早自习|早读|早修|晨读|上午|早上|午前|下午|午后|晚自习|晚修|晚上|夜自习)\s*第?\s*([一二三四五六七八九十\d]+)?\s*节?$/);
  if(m){
    const g = TBL_GROUP_KEYS[m[1]] || m[1];
    if(g === '早自习' || g === '晚自习') return g;
    return g + (m[2] ? cnNum(m[2]) : 1);
  }
  return t;
}
/* 拆分「学科 + 讲到哪」：语文:第1课 春 / 语文（第1课 春） / 语文 */
function splitSubject(tok){
  const t = String(tok || '').trim();
  const m = t.match(/^([^：:（()）]{1,12}?)\s*[：:（(]\s*(.*?)\s*[）)]?$/);
  if(m && m[1].trim()) return { subject: m[1].trim(), content: (m[2] || '').trim() };
  return { subject: t, content: '' };
}
/* 旧数据（数组：一课一行）→ 新结构（网格） */
function migrateTimetable(raw){
  if(Array.isArray(raw)){
    const t = emptyTimetable();
    const pool = TBL_DEFAULT_SLOTS.filter(s => s !== '早自习' && s !== '晚自习');
    raw.forEach(e => {
      const w = String(e.weekday || '');
      const subj = String(e.subject || '').trim();
      if(!w || !subj) return;
      t.grid[w] = t.grid[w] || {};
      const used = Object.keys(t.grid[w]).length;
      const slot = normalizeSlotName(e.slot || '') || pool[used] || ('上午' + (used + 1));
      t.grid[w][slot] = [{ subject: subj, content: String(e.lessonName || '').trim(), kind: KIND_IN }];
    });
    /* 只保留真正用到的节次，避免老数据迁移后出现一堆空行 */
    const used = [];
    for(const w of Object.keys(t.grid)) for(const s of Object.keys(t.grid[w])) if(!used.includes(s)) used.push(s);
    const known = TBL_DEFAULT_SLOTS.filter(s => used.includes(s));
    t.slots = known.concat(used.filter(s => !TBL_DEFAULT_SLOTS.includes(s)));
    return t;
  }
  if(raw && typeof raw === 'object'){
    const t = emptyTimetable();
    t.slots = (Array.isArray(raw.slots) && raw.slots.length) ? raw.slots.slice() : TBL_DEFAULT_SLOTS.slice();
    const g = (raw.grid && typeof raw.grid === 'object') ? raw.grid : {};
    for(const w of Object.keys(g)){
      const day = {};
      for(const s of Object.keys(g[w] || {})){
        const list = entriesOf(g[w][s]);
        if(list.length) day[s] = list;
      }
      if(Object.keys(day).length) t.grid[String(w)] = day;
    }
    return t;
  }
  return emptyTimetable();
}
/* —— 课表分两类：课内（一套含所有科目）/ 课外（按单科粘贴） ——
   同一个「天 × 节次」格子里允许并存两类安排，所以格子存的是【条目数组】：
   grid['1']['下午3'] = [ {subject:'数学', content:'', kind:'in'},
                          {subject:'钢琴', content:'第3课', kind:'out'} ]
   kind: 'in' = 课内, 'out' = 课外 —— 两类共用同一张课表，都进日历与统计。 */
const KIND_IN = 'in', KIND_OUT = 'out';

/* 把任意历史写法（字符串 / 单个对象 / 数组）统一成条目数组 */
function entriesOf(v){
  if(!v) return [];
  const arr = Array.isArray(v) ? v : [v];
  const out = [];
  for(const it of arr){
    let e = null;
    if(typeof it === 'string'){ e = { subject: it.trim(), content: '', kind: KIND_IN }; }
    else if(it && typeof it === 'object'){
      e = {
        subject: String(it.subject || '').trim(),
        content: String(it.content || '').trim(),
        kind: (it.kind === KIND_OUT ? KIND_OUT : KIND_IN)
      };
    }
    if(e && e.subject) out.push(e);
  }
  return out;
}

/* 节次排序权重：早自习 < 上午N < 下午N < 晚自习 < 第N节 < 其他
   课内 / 课外用同一把尺子，所以两类粘完之后节次仍然按时间顺序排。 */
function ttSlotRank(s){
  const t = String(s || '');
  if(t === '早自习') return 0;
  let m = t.match(/^上午(\d+)$/); if(m) return 100 + Number(m[1]);
  m = t.match(/^下午(\d+)$/);     if(m) return 200 + Number(m[1]);
  if(t === '晚自习') return 300;
  m = t.match(/^第(\d+)节$/);     if(m) return 400 + Number(m[1]);
  return 900;
}
/* prefer：用户显式给出的节次顺序，用于同权重时的先后 */
function sortSlots(list, prefer){
  const pool = Array.isArray(prefer) ? prefer : [];
  return list.slice().sort((a, b) => {
    const ra = ttSlotRank(a), rb = ttSlotRank(b);
    if(ra !== rb) return ra - rb;
    const pa = pool.indexOf(a), pb = pool.indexOf(b);
    if(pa >= 0 || pb >= 0) return (pa < 0 ? 999 : pa) - (pb < 0 ? 999 : pb);
    return 0;
  });
}

/* ==================== 课程设计解析 ==================== */
function parseCurriculum(text){
  const rawLines = String(text).split(/\r?\n/);
  const lines = [];
  for(const raw of rawLines){
    if(!raw.trim()) continue;
    const m = raw.match(/^(\s*)/);
    const indent = m[1].replace(/\t/g,'  ').length;
    lines.push({ indent, text: raw.trim() });
  }
  if(!lines.length) return [];
  const indents = [...new Set(lines.map(l => l.indent))].sort((a,b)=>a-b);
  const levelOf = ind => indents.indexOf(ind);
  const subjects = [];
  let curSubject=null, curUnit=null, curLesson=null;
  for(const line of lines){
    let content = line.text;
    if(/^[-*]\s+/.test(content)) content = content.replace(/^[-*]\s+/, '');
    const lv = levelOf(line.indent);
    const dm = content.match(/^([^：:]{1,8})[：:]\s*(.+)$/);
    if(dm && curLesson && lv >= 2){
      const key = dm[1].trim(); const val = dm[2].trim();
      const mapped = DETAIL_KEY_MAP[key];
      if(mapped){
        if(!curLesson.details[mapped]) curLesson.details[mapped] = [];
        curLesson.details[mapped].push(...splitList(val));
        continue;
      }
    }
    if(lv === 0){ curSubject = { id: uid(), subject: content, units: [] }; subjects.push(curSubject); curUnit = null; curLesson = null; }
    else if(lv === 1){
      if(!curSubject){ curSubject = { id: uid(), subject:'未分类', units: [] }; subjects.push(curSubject); }
      curUnit = { id: uid(), name: content, lessons: [] }; curSubject.units.push(curUnit); curLesson = null;
    }else if(lv === 2){
      if(!curUnit){
        if(!curSubject){ curSubject = { id: uid(), subject:'未分类', units: [] }; subjects.push(curSubject); }
        curUnit = { id: uid(), name:'未分组', lessons: [] }; curSubject.units.push(curUnit);
      }
      curLesson = { id: uid(), name: content, hours: 1, details: {} };
      curUnit.lessons.push(curLesson);
    }else if(curLesson){
      if(!curLesson.details.other) curLesson.details.other = [];
      curLesson.details.other.push(content);
    }
  }
  return subjects;
}

  const finalize = () => {
    const known = TBL_DEFAULT_SLOTS.filter(s => slots.includes(s));
    const unknown = slots.filter(s => !TBL_DEFAULT_SLOTS.includes(s));
    return { slots: known.concat(unknown), grid };
  };
  if(!rawLines.length) return finalize();

  /* ---------- 模式 B：矩阵表 ---------- */
  const firstCols = rawLines[0].split(/\t+|\s{2,}/);
  if(firstCols.filter(isWd).length >= 2){
    const colMap = {};
    firstCols.forEach((c, i) => { if(isWd(c)) colMap[i] = wdOf(c); });
    const firstWdIdx = Number(Object.keys(colMap)[0]);
    for(let li = 1; li < rawLines.length; li++){
      const cells = rawLines[li].split(/\t+|\s{2,}/);
      let slot = normalizeSlotName((cells[0] || '').trim());
      if(!slot){
        const w0 = colMap[firstWdIdx];
        const used = Object.keys(grid[String(w0)] || {}).length;
        slot = '第' + (used + 1) + '节';
      }
      let any = false;
      for(const idx of Object.keys(colMap)){
        const w = colMap[idx];
        const cellRaw = (cells[Number(idx)] || '').trim();
        if(!cellRaw || isNoneWord(cellRaw)) continue;
        const sp = splitSubject(cellRaw);
        put(w, slot, sp.subject || cellRaw, sp.content);
        any = true;
      }
      if(any) pushSlot(slot);
    }
    return finalize();
  }

  /* ---------- 模式 A：一行一天 ---------- */
  for(const raw of rawLines){
    let line = raw.trim();
    line = line.replace(/^(星期|礼拜)\s*([一二三四五六日天])/, '周$2')
               .replace(/^周\s+([一二三四五六日天])/, '周$1');
    const head = line.match(/^周([一二三四五六日天])/);
    if(!head) continue;
    const weekday = wdMap[head[1]];
    let rest = line.slice(head[0].length).replace(/^[\s：:、,，.．\-—]+/, '').trim();
    if(!rest) continue;
    /* 兼容旧写法里可选的「第N节」「08:00-08:45」前缀，解析后忽略 */
    rest = rest.replace(/^第\s*[\d一二三四五六七八九十]+\s*节\s*/, '')
               .replace(/^\d{1,2}:\d{2}\s*[-~—到至]\s*\d{1,2}:\d{2}\s*/, '')
               .replace(/^\d{1,2}:\d{2}\s*/, '');

    /* 先保护括号里的内容 语文（第1课 春），避免被空格切开 */
    const HOLD = '\u0001';
    const shielded = rest.replace(/[（(][^（()）]*[)）]/g, m => m.replace(/[\s\t]+/g, HOLD));
    const parts = shielded.split(/[\s\t]+/).filter(Boolean)
      .map(p => p.split(HOLD).join(' '))
      .flatMap(p => {
        const g = p.match(/^(早自习|早读|早修|上午|早上|下午|午后|晚自习|晚上|晚修)\s*[：:]\s*(.+)$/);
        if(g) return [g[1], g[2]];
        if(p.length > 1 && p.indexOf('/') > -1) return p.split('/').filter(Boolean);
        return [p];
      });

    const hasGroup = parts.some(p => TBL_GROUP_KEYS[p]);
    if(hasGroup){
      let group = null, n = 0, absorb = null;
      for(const p of parts){
        const gk = TBL_GROUP_KEYS[p];
        if(gk){ absorb = null; group = gk; n = 0; if(gk === '早自习' || gk === '晚自习') pushSlot(gk); continue; }
        if(group === null){ group = '上午'; n = 0; }
        if(isNoneWord(p)){ absorb = null; n++; continue; }
        /* 「上午 语文:第1课 春」：带内容的学科后面的词继续并入它的内容 */
        if(absorb && !/[：:（(]/.test(p) && !knownSubjects.has(p)){
          const c0 = grid[weekday][absorb];
          if(c0 && c0[0]){ c0[0].content = (c0[0].content ? c0[0].content + ' ' : '') + p; continue; }
        }
        let slot;
        if(group === '早自习' || group === '晚自习') slot = group;
        else { n++; slot = group + n; }
        pushSlot(slot);
        const sp = splitSubject(p);
        const subj = sp.subject || p;
        put(weekday, slot, subj, sp.content);
        knownSubjects.add(subj);
        absorb = sp.content ? slot : null;
      }
    }else{
      /* 模式 C：旧式一课一行 → 顺序填入非自习节次 */
      const pool = TBL_DEFAULT_SLOTS.filter(s => s !== '早自习' && s !== '晚自习');
      const used = Object.keys(grid[String(weekday)] || {}).filter(s => pool.includes(s)).length;
      const slot = pool[used] || ('第' + (used + 1) + '节');
      pushSlot(slot);
      const sp = splitSubject(parts[0]);
      const tail = parts.slice(1).join(' ').trim();
      put(weekday, slot, sp.subject || parts[0], tail || sp.content);
    }
  }
  return finalize();
}

/* ============ 课外单科课表解析 ============
   课外按「单科」粘贴：学科名在弹窗里填，正文可以只写「周几 + 节次」。
   周一 下午3 第3课        → 周一 下午3 = 该学科，讲到 第3课
   周一 下午3 钢琴 第3课   → 学科名写在正文里也认（会被去重）
   周一 第3课              → 没写节次，按「课外节次顺序」依次排
   周六 上午2 第5课        → 分组词+序号也认
   一周多天写多行即可；同一门课覆盖时会整门清掉重写。
==================================================== */
function parseExtraTimetable(text, subjectName, poolSlots){
  const subj = String(subjectName || '').trim();
  const pool = (Array.isArray(poolSlots) && poolSlots.length)
    ? poolSlots.map(normalizeSlotName).filter(Boolean)
    : ['下午3','下午4','晚自习'];
  const wdMap = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7 };
  const rawLines = String(text || '').split(/\r?\n/).filter(l => l.trim() && !/^\s*(#|\/\/)/.test(l));
  const grid = {}; const slots = [];
  const pushSlot = s => { if(s && !slots.includes(s)) slots.push(s); };
  const put = (w, slot, subject, content) => {
    const sj = String(subject || '').trim();
    if(!sj || !slot) return;
    grid[w] = grid[w] || {};
    grid[w][slot] = [{ subject: sj, content: String(content || '').trim(), kind: KIND_OUT }];
  };
  /* 判断一个词是不是「节次」而不是「学习内容」 */
  const isSlotWord = tok => {
    const t = String(tok || '').trim();
    if(!t || TBL_GROUP_KEYS[t]) return false;
    const ns = normalizeSlotName(t);
    if(!ns) return false;
    return TBL_DEFAULT_SLOTS.includes(ns)
        || /^第[一二三四五六七八九十\d]+节$/.test(ns)
        || /^(上午|下午|早自习|晚自习)\d+$/.test(ns);
  };
  for(const raw of rawLines){
    let line = raw.trim()
      .replace(/^(星期|礼拜)\s*([一二三四五六日天])/, '周$2')
      .replace(/^周\s+([一二三四五六日天])/, '周$1');
    const head = line.match(/^周([一二三四五六日天])/);
    if(!head) continue;
    const weekday = wdMap[head[1]];
    let rest = line.slice(head[0].length).replace(/^[\s：:、,，.．\-—]+/, '').trim();
    /* 允许写清时间：16:00-17:00，解析后忽略（课表本身不记小时分钟） */
    rest = rest.replace(/^\d{1,2}:\d{2}\s*[-~—到至]\s*\d{1,2}:\d{2}\s*/, '')
               .replace(/^\d{1,2}:\d{2}\s*/, '');
    if(!rest) continue;

    let slot = '', group = null; const content = [];
    for(const tok of rest.split(/[\s\t、,，\/]+/).filter(Boolean)){
      if(tok === subj) continue;                     /* 正文里重复写了学科名 → 跳过 */
      const gk = TBL_GROUP_KEYS[tok];
      if(gk){
        if(gk === '早自习' || gk === '晚自习'){ slot = gk; group = null; }
        else { group = gk; slot = ''; }
        continue;
      }
      if(isSlotWord(tok)){ slot = normalizeSlotName(tok); group = null; continue; }
      if(isNoneWord(tok)) continue;
      content.push(tok);
    }
    if(!slot){
      const day = grid[String(weekday)] || {};
      if(group){
        const used = Object.keys(day).filter(k => k.indexOf(group) === 0).length;
        slot = group + (used + 1);
      }else{
        const used = Object.keys(day).length;
        slot = pool[used] || ('第' + (used + 1) + '节');
      }
    }
    pushSlot(slot);
    put(weekday, slot, subj, content.join(' '));
  }
  return { slots: sortSlots(slots, pool), grid };
}

/* ==================== 学员切换 ==================== */
/* 只切换「当前是谁」；增删学员仍在导航中心，这里不重复造账户管理。 */
function flashTip(text){
  if(!text) return;
  let el = document.getElementById('lrTip');
  if(!el){
    el = document.createElement('div');
    el.id = 'lrTip';
    el.className = 'lr-tip';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.classList.remove('show'); }, 2800);
}
function renderChildBar(){
  const bar = document.getElementById('childBar');
  const sel = document.getElementById('childSel');
  if(!bar || !sel) return;
  const list = childList();
  const cur  = curChild();
  if(!list.length){ bar.hidden = true; return; }   // 站点还没建学员：不显示，免得凭空造一个身份
  bar.hidden = false;
  const names = list.slice();
  if(cur && names.indexOf(cur) === -1) names.unshift(cur);  // 当前学员不在清单里也让他出现
  sel.innerHTML =
    (cur ? '' : '<option value="">— 未指定 —</option>') +
    names.map(n => `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
  sel.value = cur;
  updateChildSummary();
}
/* 只改一行小字，不重建下拉框 —— 所以在每次 render 之后都可以放心调用，
 * 不会打断正在操作 select 的用户。 */
function updateChildSummary(){
  const hint = document.getElementById('childHint');
  if(!hint) return;
  const cur = curChild();
  const n = (state && Array.isArray(state.lessons)) ? state.lessons.length : 0;
  if(cur){
    hint.className = 'child-hint';
    hint.textContent = '已记 ' + n + ' 条课时';
  }else{
    hint.className = 'child-hint warn';
    hint.textContent = '未指定学员 · 数据存全局键，各学员共用';
  }
  hint.hidden = false;
}
/* 换学员：先用旧身份把当前改动落盘（dataKey() 是实时解析的，顺序不能反），
 * 再换身份、重新载入、整页重渲染。 */
function switchChild(name){
  name = String(name || '').trim();
  if(name === curChild()) return;
  save();
  setCurChild(name);
  claimLegacyData();                 // 新身份名下若是空的，看能否接手历史数据
  loadedChild = curChild();
  state = load();
  render();
  renderChildBar();
  flashTip(name ? ('已切换到「' + name + '」') : '已切到「未指定」· 数据存全局键');
}
{
  const sel = document.getElementById('childSel');
  if(sel) sel.addEventListener('change', () => switchChild(sel.value));
}
/* 别的页 / 别的标签切了学员，本页跟着切 —— 否则这一页会继续显示上一位的数据，
 * 而用户以为自己已经在看新选的那位了。 */
window.addEventListener('storage', e => {
  if(e.key && e.key !== ACCOUNT_CUR) return;
  const now = curChild();
  if(now === loadedChild) return;
  loadedChild = now;
  state = load();
  render();
  renderChildBar();
});

/* ==================== 视图路由 ==================== */
let view = 'calendar';
let calMode = 'month';
let calCursor = todayStr();
let statsRange = 'all';
let statsFrom = '';
let statsTo = '';
let todoFilter = 'all';
let cardQueue = null;
let cardFlipped = false;
let currentDayDate = null;
let curExpanded = {};
let catFilter = { grade:'', course:'', textbook:'' };
let importCategoryId = null;

function render(){
  document.querySelectorAll('.sidebar nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  const v = document.getElementById('view');
  v.scrollTop = 0;
  switch(view){
    case 'calendar':   renderCalendar();   break;
    case 'curriculum': renderCurriculum(); break;
    case 'lessons':    renderLessons();    break;
    case 'todos':      renderTodos();      break;
    case 'cards':      renderCards();      break;
    case 'goals':      renderGoals();      break;
    case 'modules':    renderCurriculum(); break;   /* 模块管理已并入课程设计 */
    case 'stats':      renderStats();      break;
  }
  updateChildSummary();
}
document.querySelector('.sidebar nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if(b){ view = b.dataset.view; if(view !== 'cards') cardFlipped = false; render(); }
});

/* ==================== 弹窗基础 ==================== */
function openModal(html, dayDate){
  const root = document.getElementById('modal-root');
  currentDayDate = dayDate || null;
  root.innerHTML = `<div class="modal-mask"><div class="modal">${html}</div></div>`;
  root.classList.add('open');
}
function closeModal(){
  const root = document.getElementById('modal-root');
  root.classList.remove('open');
  root.innerHTML = '';
  currentDayDate = null;
}
function refreshDayModal(){
  if(!currentDayDate) return;
  const m = document.querySelector('#modal-root .modal');
  const sc = m ? m.scrollTop : 0;
  const d = currentDayDate;
  openDayModal(d);
  const m2 = document.querySelector('#modal-root .modal');
  if(m2) m2.scrollTop = sc;
  render();
}

/* ==================== 公共操作处理（供视图与弹窗复用） ==================== */
function handleCommonAction(a, el){
  /* 日历导航 */
  if(a === 'cal-prev' || a === 'cal-next'){
    const step = a === 'cal-prev' ? -1 : 1;
    const d = parseDate(calCursor);
    if(calMode === 'month') d.setMonth(d.getMonth() + step);
    else d.setDate(d.getDate() + step * 7);
    calCursor = fmtDate(d); renderCalendar();
    return true;
  }
  if(a === 'cal-today'){ calCursor = todayStr(); renderCalendar(); return true; }
  if(a === 'cal-mode'){ calMode = el.dataset.mode; renderCalendar(); return true; }
  if(a === 'day'){ openDayModal(el.dataset.date); return true; }
  if(a === 'add-lesson'){ openLessonModal(null, el.dataset.date || todayStr(), el.dataset.date || null); return true; }
  if(a === 'edit-lesson'){ openLessonModal(el.dataset.id, null, currentDayDate); return true; }
  if(a === 'save-lesson'){ saveLessonForm(el.dataset.id || null); return true; }
  if(a === 'del-lesson'){
    if(confirm('确定删除这节课时记录吗？')){
      state.lessons = state.lessons.filter(x => x.id !== el.dataset.id);
      save(); closeModal(); render();
    }
    return true;
  }
  if(a === 'quick-todo'){
    const txt = prompt('待办内容：');
    if(txt && txt.trim()){
      state.todos.push({id:uid(), text:txt.trim(), moduleId:state.modules[0]?.id || '', dueDate:el.dataset.date,
        priority:'中', done:false, createdAt:Date.now()});
      save(); refreshDayModal();
    }
    return true;
  }
  /* 分类 */
  if(a === 'cat-new'){ openCategoryModal(); return true; }
  if(a === 'cat-save'){ saveCategoryForm(); return true; }
  if(a === 'cat-del'){
    const cat = state.curriculum.find(c => c.id === el.dataset.id);
    if(!cat) return true;
    const cnt = (cat.subjects||[]).reduce((n,s)=>n+(s.units||[]).reduce((m,u)=>m+(u.lessons||[]).length,0),0);
    if(!confirm(`确定删除分类「${cat.grade||''} ${cat.course||''} ${cat.textbook||''}」？包含 ${cnt} 个课时。`)) return true;
    state.curriculum = state.curriculum.filter(c => c.id !== el.dataset.id);
    save(); render(); return true;
  }
  if(a === 'cur-import-cat'){ importCategoryId = el.dataset.id; openCurriculumImport(); return true; }
  if(a === 'cur-do-import'){ doCurriculumImport(); return true; }
  if(a === 'cat-subject-del'){
    if(confirm('删除该学科及其下所有单元、课时？')){
      for(const c of state.curriculum){ c.subjects = (c.subjects||[]).filter(s => s.id !== el.dataset.id); }
      save(); render();
    }
    return true;
  }
  if(a === 'cur-lesson-del'){
    if(confirm('删除该课时？')){
      for(const c of state.curriculum){
        for(const s of (c.subjects||[])){
          for(const u of (s.units||[])){ u.lessons = (u.lessons||[]).filter(l => l.id !== el.dataset.id); }
        }
      }
      save(); render();
    }
    return true;
  }
  if(a === 'cur-lesson-toggle'){ curExpanded[el.dataset.id] = !curExpanded[el.dataset.id]; render(); return true; }
  if(a === 'cur-lesson-use'){
    const cl = findCurriculumLessonById(el.dataset.id);
    if(!cl) return true;
    closeModal();
    openLessonModal(null, todayStr(), null, cl.lesson.id);
    return true;
  }
  /* 课程表 */
  if(a === 'tbl-import'){ openTimetableImport(KIND_IN); return true; }
  if(a === 'tbl-import-out'){ openTimetableImport(KIND_OUT); return true; }
  if(a === 'tbl-view'){ view = 'calendar'; calMode = 'week'; render(); return true; }
  if(a === 'tbl-do-import'){ doTimetableImport(el.dataset.kind === 'out' ? KIND_OUT : KIND_IN); return true; }
  if(a === 'autofill'){ openAutoFill(); return true; }
  if(a === 'autofill-do'){ doAutoFill(); return true; }
  if(a === 'cur-clear'){
    if(confirm('确定清空全部课程设计与课程表数据？此操作不可恢复。')){
      state.curriculum = []; state.timetable = emptyTimetable();
      save(); closeModal(); render();
    }
    return true;
  }
  /* 课时记录 */
  if(a === 'rec-edit'){ openLessonModal(el.dataset.id, null, null); return true; }
  if(a === 'rec-del'){
    if(confirm('确定删除这条课时记录？')){
      state.lessons = state.lessons.filter(x => x.id !== el.dataset.id);
      save(); renderLessons();
    }
    return true;
  }
  /* 待办 */
  if(a === 'todo-add'){
    const inp = document.getElementById('td-text');
    const txt = inp.value.trim();
    if(!txt) return inp.focus(), true;
    state.todos.push({
      id: uid(), text: txt,
      moduleId: document.getElementById('td-module').value,
      dueDate: document.getElementById('td-date').value,
      priority: document.getElementById('td-pri').value,
      done: false, createdAt: Date.now()
    });
    save(); renderTodos(); return true;
  }
  if(a === 'todo-del'){
    state.todos = state.todos.filter(x => x.id !== el.dataset.id);
    save(); renderTodos(); return true;
  }
  if(a === 'todo-filter'){ todoFilter = el.dataset.todofilter; renderTodos(); return true; }
  /* 闪卡 */
  if(a === 'card-flip'){ cardFlipped = !cardFlipped; renderCards(); return true; }
  if(a === 'card-rate'){ rateCard(el.dataset.id, Number(el.dataset.grade)); return true; }
  if(a === 'card-reset'){ cardQueue = null; cardFlipped = false; renderCards(); return true; }
  if(a === 'card-del'){
    state.cards = state.cards.filter(x => x.id !== el.dataset.id);
    if(cardQueue) cardQueue = cardQueue.filter(x => x !== el.dataset.id);
    save(); renderCards(); return true;
  }
  if(a === 'card-add'){
    const front = document.getElementById('cd-front').value.trim();
    const back  = document.getElementById('cd-back').value.trim();
    if(!front || !back){ alert('请填写卡片正反面'); return true; }
    state.cards.push({
      id: uid(), moduleId: document.getElementById('cd-module').value,
      front, back, interval: 0, reps: 0, due: todayStr()
    });
    save(); cardQueue = null; renderCards(); return true;
  }
  /* 目标库 */
  if(a === 'goal-add'){
    const title = document.getElementById('gl-title').value.trim();
    if(!title){ alert('请填写知识点名称'); return true; }
    state.goals.push({
      id: uid(),
      moduleId: document.getElementById('gl-module').value,
      title,
      desc: document.getElementById('gl-desc').value.trim(),
      level: document.getElementById('gl-level').value
    });
    save(); renderGoals(); return true;
  }
  if(a === 'goal-del'){ state.goals = state.goals.filter(x => x.id !== el.dataset.id); save(); renderGoals(); return true; }
  if(a === 'goal-plan'){
    const g = goalById(el.dataset.id);
    if(!g) return true;
    const d = prompt('安排到哪一天？(YYYY-MM-DD)', todayStr());
    if(!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return true;
    const t = prompt('上课时间（可留空）', '');
    state.lessons.push({
      id: uid(), date: d, time: t || '', duration: 0, moduleId: g.moduleId, type: '课内',
      goalId: g.id, title: g.title, status: '未完成', mastered: false, note: '',
      detailItems: [], createdAt: Date.now()
    });
    save(); alert(`已把「${g.title}」加入 ${d} 的日历`); renderGoals(); return true;
  }
  /* ---- 名称管理（学科 = 模块；年级 / 课程 / 教材 = 字典词条） ---- */
  if(a === 'name-panel-toggle'){ namePanelOpen = !namePanelOpen; renderCurriculum(); return true; }
  if(a === 'mod-del'){
    const m = moduleById(el.dataset.id);
    if(!m) return true;
    const cnt = state.lessons.filter(l => l.moduleId === m.id).length;
    const msg = cnt
      ? `「${m.name}」下有 ${cnt} 条课时记录，删除后这些记录将变为「未分类」。确定删除？`
      : `确定从名称管理里删除学科「${m.name}」？`;
    if(!confirm(msg)) return true;
    state.modules = state.modules.filter(x => x.id !== m.id);
    state.goals = state.goals.filter(g => g.moduleId !== m.id);
    save(); render(); return true;
  }
  if(a === 'mod-add'){
    const name = String(((document.getElementById('md-name') || {}).value) || '').trim();
    const color = ((document.getElementById('md-color') || {}).value) || randColor();
    if(!name){ alert('请输入学科名称'); return true; }
    if(state.modules.some(m => normName(m.name) === normName(name))){
      alert(`学科「${name}」已存在（名称管理里已有同义写法）`); return true;
    }
    state.modules.push({ id: uid(), name, color });
    save(); render(); return true;
  }
  if(a === 'dict-add'){
    const kind = el.dataset.kind;
    const v = String(((document.getElementById('dict-new-' + kind) || {}).value) || '').trim();
    if(!v){ alert('请输入名称'); return true; }
    if(dictList(kind).some(x => normName(x) === normName(v))){ alert(`「${v}」已存在`); return true; }
    addDictEntry(kind, v);
    save(); render(); return true;
  }
  if(a === 'dict-del'){
    const kind = el.dataset.kind, name = el.dataset.name;
    const used = state.curriculum.filter(c => normName(c[kind] || '') === normName(name)).length;
    const msg = used
      ? `「${name}」已被 ${used} 个分类使用。删除词条不会改动已有分类，继续？`
      : `确定删除词条「${name}」？`;
    if(!confirm(msg)) return true;
    state.dict[kind] = (state.dict[kind] || []).filter(x => normName(x) !== normName(name));
    save(); render(); return true;
  }
  if(a === 'dict-quick-add'){   /* 新建分类弹窗内联新增词条：加进字典 + 直接选中，不丢当前填写 */
    const kind = el.dataset.kind, target = el.dataset.target;
    const labelMap = { grade:'年级', course:'课程', textbook:'教材' };
    const v = prompt(`新增${labelMap[kind] || '词条'}名称（会写入名称管理，以后随取随用）：`);
    if(v && v.trim()){
      const canon = addDictEntry(kind, v);
      const sel = document.getElementById(target);
      if(sel){
        let opt = Array.from(sel.options).find(o => o.value === canon);
        if(!opt){ opt = document.createElement('option'); opt.value = canon; opt.textContent = canon; sel.appendChild(opt); }
        sel.value = canon;
      }
      save();
    }
    return true;
  }
  if(a === 'subj-quick-add'){   /* 粘贴课外课表弹窗内联新增学科 */
    const v = prompt('新增学科名称（会写入名称管理，其它地方从此只能下拉选取）：');
    if(v && v.trim()){
      const canon = addSubject(v);
      const sel = document.getElementById('tbl-subject');
      if(sel){
        let opt = Array.from(sel.options).find(o => o.value === canon);
        if(!opt){ opt = document.createElement('option'); opt.value = canon; opt.textContent = canon; sel.appendChild(opt); }
        sel.value = canon;
      }
      save();
    }
    return true;
  }
  /* 统计 */
  if(a === 'stat-range'){
    statsRange = el.dataset.range;
    statsFrom = ''; statsTo = '';
    renderStats(); return true;
  }
  /* 粘贴课程内容：先选目标分类 */
  if(a === 'cur-content-import'){
    if(!state.curriculum.length){ alert('请先点「新建分类」（年级 / 课程 / 教材），再粘贴课程内容'); return true; }
    if(state.curriculum.length === 1){ importCategoryId = state.curriculum[0].id; openCurriculumImport(); return true; }
    const pickHtml = `<div class="modal-head"><h3>📚 粘贴课程内容 · 选择目标分类</h3><button class="btn ghost" data-action="modal-close">✕</button></div>
      <div class="help-box">课程内容归属于某个分类（年级 / 课程 / 教材）。请选择要导入到哪个分类：</div>
      <div class="mod-list">${state.curriculum.map(c => {
        const label = [c.grade, c.course, c.textbook].filter(Boolean).join(' · ') || '未命名分类';
        const n = (c.subjects||[]).reduce((k,s)=>k+(s.units||[]).reduce((m,u)=>m+(u.lessons||[]).length,0),0);
        return `<div class="mod-item"><span class="nm">📂 ${esc(label)}</span><span class="meta">${n} 课时</span><span class="spacer"></span><button class="btn xs primary" data-action="cur-pick-cat" data-id="${c.id}">选它</button></div>`;
      }).join('')}</div>`;
    openModal(pickHtml);
    return true;
  }
  if(a === 'cur-pick-cat'){ importCategoryId = el.dataset.id; openCurriculumImport(); return true; }
  /* 从该日课表一键带入课程内容 */
  if(a === 'pick-tbl'){
    applyTimetableToForm(Number(el.dataset.w || 0), el.dataset.slot || '', el.dataset.kind || '');
    return true;
  }
  /* 近日课程：点一下 = 开「添加课时」并把该节课带进表单 */
  if(a === 'up-tbl'){
    const d0 = el.dataset.date, s0 = el.dataset.slot || '', k0 = el.dataset.kind || '';
    openLessonModal(null, d0, null);
    applyTimetableToForm(WD_INDEX(d0), s0, k0);
    return true;
  }
  /* 快捷添加（知识点条目） */
  if(a === 'detail-todo'){ return quickAddTodo(el); }
  if(a === 'detail-card'){ return quickAddCard(el); }
  if(a === 'detail-goal'){ return quickAddGoal(el); }
  /* 批量：勾选项加入待办 / 闪卡 / 目标（此前缺失路由，按钮无效） */
  if(a === 'import-todos'){ importSelectedToTodos(); return true; }
  if(a === 'import-cards'){ importSelectedToCards(); return true; }
  if(a === 'import-goals'){ importSelectedToGoals(); return true; }
  return false;
}

/* ==================== 弹窗事件委托 ==================== */
document.getElementById('modal-root').addEventListener('click', e => {
  /* 点击蒙层关闭 */

  const el = e.target.closest('[data-action]');

document.getElementById('modal-root').addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.change){
    const l = state.lessons.find(x => x.id === el.dataset.id);
    if(!l) return;
    if(el.dataset.change === 'status')   l.status = el.value;
    if(el.dataset.change === 'mastered') l.mastered = el.checked;
    if(el.dataset.change === 'note')     l.note = el.value;
    save(); refreshDayModal(); return;
  }
  if(el.dataset.toggleTodo){

});

document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeModal(); render(); } });

/* ==================== 快捷添加（知识点条目） ==================== */
function quickAddTodo(btn){
  const type = btn.dataset.qtype;
  const value = btn.dataset.qvalue;
  const moduleId = document.getElementById('lf-module').value;
  const date = document.getElementById('lf-date').value || todayStr();
  state.todos.push({
    id: uid(), text: value, moduleId,
    dueDate: date, priority: '中', done: false, createdAt: Date.now()
  });
  save();
  markSelected(type, value);
  flashBtn(btn, '📝', '✓');
  return true;
}

function quickAddCard(btn){
  const type = btn.dataset.qtype;
  const value = btn.dataset.qvalue;
  const moduleId = document.getElementById('lf-module').value;
  let front = value;
  let back = `类型：${DETAIL_LABELS[type] || type}\n（请补充释义或答案）`;
  if(type === 'words'){ back = `单词：${value}\n词义/用法：（请补充）`; }
  if(type === 'formulas'){ back = `公式：${value}\n（请补充适用条件）`; }
  if(type === 'grammar'){ front = `语法点：${value}`; back = `（请补充规则与例句）`; }
  state.cards.push({
    id: uid(), moduleId, front, back,
    interval: 0, reps: 0, due: todayStr()
  });
  save();
  markSelected(type, value);
  flashBtn(btn, '🃏', '✓');
  return true;
}

function quickAddGoal(btn){
  const type = btn.dataset.qtype;
  const value = btn.dataset.qvalue;
  const moduleId = document.getElementById('lf-module').value;
  if(state.goals.some(g => g.title === value && g.moduleId === moduleId)){
    flashBtn(btn, '🎯', '✓');
    return true;
  }
  state.goals.push({
    id: uid(), moduleId, title: value,
    desc: `来自课程设计：${DETAIL_LABELS[type] || type}`,
    level: '基础'
  });
  save();
  markSelected(type, value);
  flashBtn(btn, '🎯', '✓');
  return true;
}

function markSelected(type, value){
  const area = document.getElementById('lf-detail-area');
  if(!area) return;
  const chip = area.querySelector(`.detail-chip input[data-detail-type="${type}"][value="${cssEscape(value)}"]`);
  if(!chip) return;
  if(!chip.checked){
    chip.checked = true;
    chip.closest('.detail-chip').classList.add('on');
    const cnt = area.querySelectorAll('.detail-chip input:checked').length;
    const el = area.querySelector('#sel-count');
    if(el) el.textContent = cnt;
  }
}

function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

function flashBtn(btn, orig, ok){
  const original = btn.textContent;
  btn.textContent = ok;
  btn.disabled = true;
  btn.style.background = '#10b981';
  btn.style.color = '#fff';
  setTimeout(() => {
    btn.textContent = orig;
    btn.disabled = false;
    btn.style.background = '';
    btn.style.color = '';
  }, 900);
}

/* ==================== 课表 / 近日课程 渲染 ==================== */
/* 把「某天某节次」的课带进「添加课时」表单：节次 → 模块 → 课程内容 → 标题 → 知识点 */
function applyTimetableToForm(weekday, slotName, kind){
  const list = (weekday && slotName) ? tblEntries(weekday, slotName) : [];
  if(!list.length) return false;
  const cell = (kind ? list.find(e => e.kind === kind) : null) || list[0];
  const subject = cell.subject, kw = cell.content || '';
  const ss = document.getElementById('lf-slot'); if(ss) ss.value = slotName;
  const ts = document.getElementById('lf-type'); if(ts) ts.value = typeOfKind(cell.kind);
  const newMid = moduleIdByName(subject);
  const ms = document.getElementById('lf-module'); if(ms) ms.value = newMid;
  const gs = document.getElementById('lf-goal'); if(gs) gs.innerHTML = goalOptions(newMid, '');
  const found = (kw ? findCurriculumLessonByName(subject, kw) : null) || firstLessonOfSubject(subject);
  const ti = document.getElementById('lf-title');
  const cs = document.getElementById('lf-curriculum');
  if(found){
    if(cs) cs.value = found.lesson.id;
    if(ti && !ti.value.trim()) ti.value = found.lesson.name;
    applyCurriculumToForm(found.lesson.id, []);
  }else{
    if(cs) cs.value = '';
    if(ti && !ti.value.trim()) ti.value = kw || subject;
    renderDetailPicker(null, []);
  }
  save();
  return true;
}

function monthHTML(days){
  const curM = parseDate(calCursor).getMonth();
  return `<div class="cal-grid">
    ${WD.map(w => `<div class="cal-wd">周${w}</div>`).join('')}
    ${days.map(d => {
      const dt = parseDate(d);
      const ls = lessonsOn(d);
      const td = state.todos.filter(t => t.dueDate === d && !t.done);
      const cls = ['cal-cell'];
      if(dt.getMonth() !== curM) cls.push('muted');
      if(d === todayStr()) cls.push('today');
      return `<div class="${cls.join(' ')}" data-action="day" data-date="${d}">
        <div class="cal-top">
          <span class="cal-num">${dt.getDate()}</span>
          ${ls.length ? `<span class="cal-count">${ls.length}节</span>` : ''}
        </div>
        <div class="cal-items">
          ${ls.slice(0,3).map(l => `<div class="cal-chip" style="--c:${moduleColor(l.moduleId)}" title="${esc(l.title)}">
            ${slotLabel(l) ? `<b>${esc(slotLabel(l))}</b> ` : ''}${esc(moduleName(l.moduleId))}·${esc(l.title)}
            ${l.status === '已完成' ? '✓' : l.status === '部分完成' ? '◐' : '○'}
          </div>`).join('')}
          ${ls.length > 3 ? `<div class="cal-more">+${ls.length-3} 更多</div>` : ''}
        </div>
        ${td.length ? `<div class="cal-todo">⏳ ${td.length} 项待办</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

      const td = state.todos.filter(t => t.dueDate === d && !t.done);

        <div class="week-body">
          ${ls.map(l => `
            <div class="lcard" style="--c:${moduleColor(l.moduleId)}" data-action="edit-lesson" data-id="${l.id}">

let lessonCtx = { backDate: null };

function goalOptions(mid, sel){
  const gs = state.goals.filter(g => g.moduleId === mid);
  return `<option value="">（不使用目标库）</option>`
    + gs.map(g => `<option value="${g.id}" ${g.id === sel ? 'selected' : ''}>${esc(g.title)}</option>`).join('')
    + `<option value="__custom" ${sel === '__custom' ? 'selected' : ''}>✎ 自定义内容</option>`;
}

function curriculumOptions(selectedId){
  let html = `<option value="">— 手动输入（或从下方课程设计选择） —</option>`;
  for(const cat of state.curriculum){
    const catLabel = [cat.grade, cat.course, cat.textbook].filter(Boolean).join(' · ') || '未命名分类';
    let hasAny = false;
    let group = `<optgroup label="${esc(catLabel)}">`;
    for(const s of (cat.subjects || [])){
      for(const u of (s.units || [])){
        for(const l of (u.lessons || [])){
          hasAny = true;
          group += `<option value="${l.id}" ${l.id === selectedId ? 'selected' : ''}>${esc(s.subject)} · ${esc(u.name)} · ${esc(l.name)}</option>`;
        }
      }
    }
    group += `</optgroup>`;
    if(hasAny) html += group;
  }
  return html;
}

function applyCurriculumToForm(lessonId, existingItems){
  const cl = findCurriculumLessonById(lessonId);
  const area = document.getElementById('lf-detail-area');
  if(!cl || !area){ if(area) renderDetailPicker(null, existingItems || []); return; }
  const l = cl.lesson;

  const titleInp = document.getElementById('lf-title');
  if(titleInp && !titleInp.value.trim()) titleInp.value = l.name;

  const contInp = document.getElementById('lf-contents');
  const contents = l.details.contents || [];
  if(contInp){
    const cur = contInp.value.trim();
    if(!cur) contInp.value = contents.join('；');
    else if(contents.length && !cur.includes(contents[0])) contInp.value = cur + '；' + contents.join('；');
  }

  const goalInp = document.getElementById('lf-goal');
  const goals = l.details.goals || [];
  if(goalInp && goals.length){
    const matched = state.goals.find(g => goals.some(x => x.includes(g.title) || g.title.includes(x)));
    if(matched) goalInp.value = matched.id;
  }

  renderDetailPicker(l, existingItems || []);
}

/* 渲染详情选择器（带快捷按钮） */
function renderDetailPicker(lesson, existingItems){
  const area = document.getElementById('lf-detail-area');
  if(!area) return;

  if(!lesson || !lesson.details || !Object.keys(lesson.details).length){
    area.innerHTML = `<div class="pull-area"><div class="empty" style="border:none;background:transparent;padding:10px;">该课程暂无具体知识点，请先在【课程设计】中导入</div></div>`;
    return;
  }

  const used = new Set((existingItems || []).map(d => d.type + '::' + d.value));

  let html = `<div class="pull-area">
    <div class="pull-header">
      <b>📌 具体学习内容（勾选 + 一键添加）</b>
      <span class="tag" style="background:#e0f2fe;color:#0369a1">已选 <span id="sel-count">0</span> 项</span>
    </div>`;

  for(const [type, arr] of Object.entries(lesson.details)){
    if(!arr || !arr.length) continue;
    const label = DETAIL_LABELS[type] || type;
    html += `<div class="detail-group">
      <div class="dg-head">${label}</div>
      <div class="dg-items">
        ${arr.map(v => {
          const key = type + '::' + v;
          const on = used.has(key);
          return `<div class="detail-item">
            <label class="detail-chip ${on?'on':''}">
              <input type="checkbox" data-detail-type="${type}" value="${esc(v)}" ${on?'checked':''}>
              <span class="check-mark"></span>
              <span>${esc(v)}</span>
            </label>
            <button class="quick-btn" data-action="detail-todo" data-qtype="${type}" data-qvalue="${esc(v)}" title="直接添加为待办">📝</button>
            <button class="quick-btn" data-action="detail-card" data-qtype="${type}" data-qvalue="${esc(v)}" title="直接生成闪卡">🃏</button>
            <button class="quick-btn" data-action="detail-goal" data-qtype="${type}" data-qvalue="${esc(v)}" title="加入学习目标">🎯</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  html += `<div class="pull-actions">
    <span style="font-size:12.5px;color:var(--muted);">批量：</span>
    <button class="btn xs success" data-action="import-todos">➕ 勾选项全部导入待办</button>
    <button class="btn xs primary" data-action="import-cards">🃏 勾选项全部生成闪卡</button>
    <button class="btn xs" data-action="import-goals">🎯 勾选项全部加入目标</button>
  </div></div>`;

  area.innerHTML = html;

  const updateCount = () => {
    const cnt = area.querySelectorAll('.detail-chip input:checked').length;
    const el = area.querySelector('#sel-count');
    if(el) el.textContent = cnt;
  };

  area.querySelectorAll('.detail-chip input').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('.detail-chip').classList.toggle('on', cb.checked);
      updateCount();
    });
  });
  updateCount();
}

function collectDetailItems(){
  const area = document.getElementById('lf-detail-area');
  if(!area) return [];
  const items = [];
  area.querySelectorAll('.detail-chip input:checked').forEach(cb => {
    items.push({ type: cb.dataset.detailType, value: cb.value });
  });
  return items;
}

function saveLessonForm(id){
  const g = i => document.getElementById(i);
  const date = g('lf-date').value;
  const title = g('lf-title').value.trim();
  if(!date){ alert('请选择日期'); return; }
  if(!title){ alert('请填写上课内容'); return; }
  let goalId = g('lf-goal').value;
  if(goalId === '__custom') goalId = '';

  const curriculumLessonId = g('lf-curriculum').value || '';
  const contentsRaw = g('lf-contents').value.trim();
  const contents = contentsRaw ? splitList(contentsRaw) : [];
  const detailItems = collectDetailItems();

  const obj = {
    date,
    slot: (g('lf-slot') ? g('lf-slot').value : ''),
    time: g('lf-time').value,
    duration: Number(g('lf-duration').value) || 0,
    moduleId: g('lf-module').value,
    type: g('lf-type').value,
    goalId, curriculumLessonId, title, contents, detailItems,
    status: g('lf-status').value,
    mastered: g('lf-mastered').value === '1',
    note: g('lf-note').value.trim()
  };

  if(id){ Object.assign(state.lessons.find(x => x.id === id), obj); }
  else{ state.lessons.push({ id: uid(), createdAt: Date.now(), ...obj }); }
  save();

  const back = lessonCtx.backDate;
  if(back){ openDayModal(back); } else { closeModal(); }
  render();
}

/* ==================== 批量导入 ==================== */
function importSelectedToTodos(){
  const items = collectDetailItems();
  if(!items.length){ alert('请先勾选需要导入的知识点'); return; }
  const date = document.getElementById('lf-date').value || todayStr();
  const moduleId = document.getElementById('lf-module').value;
  let added = 0;
  for(const it of items){
    if(state.todos.some(t => t.text === it.value && t.dueDate === date)) continue;
    state.todos.push({
      id: uid(), text: it.value, moduleId,
      dueDate: date, priority: '中', done: false, createdAt: Date.now()
    });
    added++;
  }
  save();
  alert(`成功导入 ${added} 条待办事项！`);
}

function importSelectedToCards(){
  const items = collectDetailItems();
  if(!items.length){ alert('请先勾选需要生成闪卡的知识点'); return; }
  const moduleId = document.getElementById('lf-module').value;
  let added = 0;
  for(const it of items){
    let front = it.value;
    let back = `类型：${DETAIL_LABELS[it.type] || it.type}\n（请补充释义或答案）`;
    if(it.type === 'words'){ back = `单词：${it.value}\n词义/用法：（请补充）`; }
    if(it.type === 'formulas'){ back = `公式：${it.value}\n（请补充适用条件）`; }
    if(it.type === 'grammar'){ front = `语法点：${it.value}`; back = `（请补充规则与例句）`; }
    state.cards.push({
      id: uid(), moduleId, front, back, interval: 0, reps: 0, due: todayStr()
    });
    added++;
  }
  save();
  alert(`成功生成 ${added} 张复习闪卡！`);
}

function importSelectedToGoals(){
  const items = collectDetailItems();
  if(!items.length){ alert('请先勾选需要加入目标库的知识点'); return; }
  const moduleId = document.getElementById('lf-module').value;
  let added = 0;
  for(const it of items){
    if(state.goals.some(g => g.title === it.value && g.moduleId === moduleId)) continue;
    state.goals.push({
      id: uid(), moduleId, title: it.value,
      desc: `来自课程设计：${DETAIL_LABELS[it.type] || it.type}`,
      level: '基础'
    });
    added++;
  }
  save();
  alert(`成功加入 ${added} 个学习目标！`);
}

function saveCategoryForm(){

function doCurriculumImport(){
  const text = ((document.getElementById('cur-import-text') || {}).value || '');
  if(!text.trim()){ alert('请粘贴课程设计内容'); return; }
  const parsed = parseCurriculum(text);
  if(!parsed.length){ alert('没有解析到有效内容，请检查缩进格式'); return; }

  const catId = importCategoryId;
  const cat = catId ? state.curriculum.find(c => c.id === catId) : null;
  if(!cat){ alert('找不到目标分类，请从分类卡片点击导入'); return; }

  /* ① 学科名先归一：对齐名称管理里的写法；新学科自动入库 */
  const addedSubjects = [];
  for(const sub of parsed){
    const canon = canonSubject(sub.subject);
    sub.subject = canon;
    if(!state.modules.some(m => normName(m.name) === normName(canon))) addedSubjects.push(canon);
    addSubject(canon);
  }

  /* ② 合并 = 按 学科 / 单元 / 课时 名字归并（复用 id，details 去重相加）；覆盖 = 整分类重写 */
  const modeEl = document.querySelector('input[name="cur-mode"]:checked');
  const mode = modeEl ? modeEl.value : 'merge';
  const before = countLessonsOf(cat);
  if(mode === 'replace'){
    cat.subjects = parsed;
  }else{
    cat.subjects = cat.subjects || [];
    mergeSubjectsInto(cat.subjects, parsed);
  }
  const after = countLessonsOf(cat);

  save();
  closeModal();
  view = 'curriculum';
  render();
  alert(`导入成功（${mode === 'merge' ? '合并' : '覆盖'}）：本分类课时 ${before} → ${after}`
    + (addedSubjects.length ? `\n新增学科：${addedSubjects.join('、')}（已加入名称管理）` : ''));
}

   清空范围只看 kind —— 课内覆盖 = 清掉所有课内；课外覆盖 = 只清掉这一门的课外。 */
function applyParsedTimetable(parsed, opt){
  const kind = (opt.kind === KIND_OUT) ? KIND_OUT : KIND_IN;
  const mode = (opt.mode === 'merge') ? 'merge' : 'replace';
  const subj = String(opt.subject || '').trim();
  const grid = gridNow();
  let cleared = 0;
  if(mode === 'replace'){
    for(const w of Object.keys(grid)){
      for(const s of Object.keys(grid[w])){
        const kept = entriesOf(grid[w][s]).filter(e => {
          const drop = (e.kind === kind) && (kind === KIND_IN || !subj || e.subject === subj);
          if(drop) cleared++;
          return !drop;
        });
        if(kept.length) grid[w][s] = kept; else delete grid[w][s];
      }
      if(!Object.keys(grid[w] || {}).length) delete grid[w];
    }
  }
  let added = 0; const days = new Set();
  for(const w of Object.keys(parsed.grid)){
    days.add(w);
    for(const s of Object.keys(parsed.grid[w])){
      grid[w] = grid[w] || {};
      const list = entriesOf(grid[w][s]);
      for(const e of entriesOf(parsed.grid[w][s])){
        const sub = canonSubject(e.subject) || e.subject;   /* 学科名对齐名称管理 */
        const idx = list.findIndex(x => x.kind === e.kind && x.subject === sub);
        const item = { subject: sub, content: e.content || '', kind: e.kind };
        if(idx >= 0) list[idx] = item; else { list.push(item); added++; }
      }
      grid[w][s] = list;
    }
  }
  /* 节次行 = 确实排了课的 + 本次解析出的 + 用户显式指定的，避免出现空行
     两类课表共用同一套节次行，合完仍按时间顺序排 */
  const merged = usedSlotsIn(grid).slice();
  parsed.slots.forEach(s => { if(!merged.includes(s)) merged.push(s); });
  (opt.keepSlots || []).forEach(s => { if(!merged.includes(s)) merged.push(s); });
  state.timetable = { slots: sortSlots(merged, opt.keepSlots), grid };
  /* 新出现的学科 → 补进名称管理（幂等，同义写法不会再建第二个） */
  tblAllEntries().forEach(e => { addSubject(e.subject); });
  return { added, cleared, days: days.size };
}

function doTimetableImport(kind){
  const isOut = (kind === KIND_OUT);
  const text = ((document.getElementById('tbl-import-text') || {}).value || '');
  if(!text.trim()){ alert('请粘贴课程表内容'); return; }
  const slotStr = (((document.getElementById('tbl-slots') || {}).value) || '').trim();
  const rawSubj = (((document.getElementById('tbl-subject') || {}).value) || '').trim();
  if(isOut && !rawSubj){ alert('课外课按单科粘贴，请先从下拉里选一个学科（没有就先点「＋新增」）'); return; }
  const subjName = isOut ? addSubject(rawSubj) : '';   /* 归一后写回名称管理 */

  let parsed; let keepSlots = [];
  if(isOut){
    /* 课外弹窗里的「节次顺序」只决定「省略节次时依次填哪几节」，不往课表里加空行 */
    const pool = slotStr ? slotStr.split(/[\s,，、]+/).filter(Boolean).map(normalizeSlotName).filter(Boolean) : [];
    parsed = parseExtraTimetable(text, subjName, pool);
  }else{
    parsed = parseTimetable(text, { kind: KIND_IN });
    if(slotStr){   /* 课内弹窗里的「节次顺序」= 用户想看到的节次行，显式保留 */
      keepSlots = slotStr.split(/[\s,，、]+/).filter(Boolean).map(normalizeSlotName).filter(Boolean);
      parsed.slots = keepSlots.concat(parsed.slots.filter(s => !keepSlots.includes(s)));
    }
  }
  if(!tblHasAnyIn(parsed)){
    alert('没有解析到有效课程。\n格式示例：' + (isOut ? '周一 下午3 第3课' : '周一 早自习 无 上午 语文 英语 下午 数学 体育'));
    return;
  }
  const modeEl = document.querySelector('input[name="tbl-mode"]:checked');
  const mode = modeEl ? modeEl.value : (isOut ? 'merge' : 'replace');
  const r = applyParsedTimetable(parsed, { kind: isOut ? KIND_OUT : KIND_IN, subject: subjName, mode, keepSlots });
  state.timetablePeriod = {
    from: ((document.getElementById('tbl-from') || {}).value) || '',
    to:   ((document.getElementById('tbl-to')   || {}).value) || ''
  };
  save(); closeModal(); render();
  const p = state.timetablePeriod;
  const kc = tblKindCounts();
  alert(`${isOut ? '课外「' + subjName + '」' : '课内课表'}导入成功（${mode === 'merge' ? '合并' : '覆盖'}）\n`
    + `写入 ${r.added} 节 · 覆盖掉 ${r.cleared} 节 · 涉及 ${r.days} 天\n`
    + `当前课表：📘 课内 ${kc.in} 节 · 🎹 课外 ${kc.out} 节`
    + ((p.from || p.to) ? `\n有效周期：${p.from || '不限'} ~ ${p.to || '不限'}` : ''));
}

/* ==================== 自动填充日历（受课表有效周期约束） ==================== */
function openAutoFill(){
  if(!tblHasAny()){ alert('请先粘贴课程表'); return; }
  const p = state.timetablePeriod || {};
  let start = (p.from && p.from > todayStr()) ? p.from : addDays(startOfWeek(todayStr()), 7);
  let weeks = 18;
  if(p.to){
    const diff = Math.round((parseDate(p.to) - parseDate(startOfWeek(start))) / 86400000);
    weeks = Math.max(1, Math.floor(diff / 7) + 1);
  }
  const html = `
    <div class="modal-head">
      <h3>⚡ 自动填充日历</h3>
      <button class="btn ghost" data-action="modal-close">✕</button>
    </div>
    <div class="help-box">
      按周循环生成课时记录，<b>只会在课表有效周期（${esc(timetablePeriodLabel())}）内生成</b>。<br>
      每节课会按「学科 + 课程内容」匹配课程内容库，自动带入标题、学习内容和知识点。
    </div>
    <div class="form-grid">
      <label class="fld"><span>开始日期</span><input type="date" id="af-start" value="${start}"></label>
      <label class="fld"><span>周数</span><input type="number" id="af-weeks" value="${weeks}" min="1" max="80"></label>
      <label class="fld chk span2"><input type="checkbox" id="af-skip" checked> 跳过已有记录（同日同时段不重复添加）</label>
    </div>
    <div class="modal-foot">
      <span class="spacer"></span>
      <button class="btn" data-action="modal-close">取消</button>
      <button class="btn primary" data-action="autofill-do">开始填充</button>
    </div>`;
  openModal(html);
}

function doAutoFill(){
  const start = document.getElementById('af-start').value;
  const weeks = Math.max(1, Number(document.getElementById('af-weeks').value) || 18);
  const skip = document.getElementById('af-skip').checked;
  if(!start){ alert('请选择开始日期'); return; }

  const startWeek = startOfWeek(start);
  let added = 0, matched = 0;
  const outDays = new Set();
  for(let w = 0; w < weeks; w++){
    for(let day = 1; day <= 7; day++){
      const date = addDays(startWeek, (day - 1) + w * 7);
      if(date < start) continue;
      const list = daySlots(day);
      if(!list.length) continue;
      if(!inTimetablePeriod(date)){ outDays.add(date); continue; }

      for(const e of list){
        /* 课表里写了「讲到哪」就按内容匹配；只写了学科名则退化到该学科的第一个课时 */
        const found = (e.content ? findCurriculumLessonByName(e.subject, e.content) : null) || firstLessonOfSubject(e.subject);
        const cl = found ? found.lesson : null;
        const title = cl ? cl.name : (e.content || e.subject);
        const moduleId = moduleIdByName(e.subject);

        if(skip){
          const dup = state.lessons.some(l => l.date === date && l.slot === e.slot && l.title === title);
          if(dup) continue;
        }

        state.lessons.push({
          id: uid(), date, slot: e.slot, time: '', duration: 0,
          moduleId, type: typeOfKind(e.kind), goalId: '',
          curriculumLessonId: cl ? cl.id : '',
          title,
          contents: cl ? (cl.details.contents || []) : [],
          detailItems: [],
          status: '未完成', mastered: false, note: '',
          createdAt: Date.now()
        });
        added++;
        if(cl) matched++;
      }
    }
  }
  save(); closeModal(); render();
  alert(`填充完成：新增 ${added} 条课时记录，其中 ${matched} 条匹配到课程内容。${outDays.size ? `\n已跳过 ${outDays.size} 天超出课表有效周期的安排。` : ''}`);
}
