<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>人际沟通复盘系统 · 口才情商迭代</title>
    <!-- 预取其它两个工具页：切换时直接从缓存加载，减少白屏卡顿 -->
    <link rel="prefetch" href="./index.html">
    <link rel="prefetch" href="./study-record.html">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        primaryLight: '#818CF8',
                        secondary: '#10B981',
                        warn: '#F59E0B',
                        danger: '#EF4444',
                        neutral: '#64748B',
                        surface: '#F8FAFC',
                        darkSurface: '#1E293B',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* ===== 基础重置 & 全局 ===== */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background 0.35s ease, color 0.35s ease;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* ===== 卡片 ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(79, 70, 229, 0.10);
        }
        .dark .glass-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        /* ===== 表单 ===== */
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: #fff;
            padding: 0.55rem 0.85rem;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            color: #1e293b;
        }
        .dark .form-input,
        .dark .form-select,
        .dark .form-textarea {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .dark .form-input:focus,
        .dark .form-select:focus,
        .dark .form-textarea:focus {
            border-color: #818CF8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }
        .form-textarea {
            resize: vertical;
            min-height: 50px;
        }
        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.2rem;
            letter-spacing: 0.02em;
        }
        .dark .form-label {
            color: #94a3b8;
        }

        /* ===== 标签 ===== */
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #eef2ff;
            color: #4F46E5;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            user-select: none;
        }
        .dark .tag-pill {
            background: #312e81;
            color: #c7d2fe;
        }
        .tag-pill:hover {
            background: #dbeafe;
            transform: scale(1.03);
        }
        .dark .tag-pill:hover {
            background: #4338ca;
        }
        .tag-pill.active {
            background: #4F46E5;
            color: #fff;
            border-color: #4F46E5;
        }
        .dark .tag-pill.active {
            background: #818CF8;
            color: #0f172a;
        }
        .tag-pill .del-tag {
            opacity: 0.5;
            font-size: 0.7rem;
            margin-left: 0.15rem;
            transition: opacity 0.2s;
        }
        .tag-pill .del-tag:hover {
            opacity: 1;
        }

        /* ===== 记录卡片 ===== */
        .record-item {
            transition: all 0.25s ease;
            border-radius: 12px;
            padding: 1rem;
            background: #fff;
            border: 1px solid #f1f5f9;
            cursor: pointer;
        }
        .dark .record-item {
            background: #1e293b;
            border-color: #334155;
        }
        .record-item:hover {
            border-color: #c7d2fe;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.06);
        }
        .dark .record-item:hover {
            border-color: #4F46E5;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        /* ===== 统计数字动画 ===== */
        .stat-number {
            font-variant-numeric: tabular-nums;
        }

        /* ===== 空状态 ===== */
        .empty-state svg {
            opacity: 0.3;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: fadeIn 0.25s ease;
        }
        .dark .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
        }
        .modal-box {
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
        }
        .toast-item {
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            background: #1e293b;
            color: #f1f5f9;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-left: 4px solid #4F46E5;
        }
        .dark .toast-item {
            background: #0f172a;
        }
        .toast-item.success {
            border-left-color: #10B981;
        }
        .toast-item.error {
            border-left-color: #EF4444;
        }
        .toast-item.warning {
            border-left-color: #F59E0B;
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .toast-item.removing {
            animation: slideOutRight 0.3s ease forwards;
        }
        @keyframes slideOutRight {
            to {
                opacity: 0;
                transform: translateX(40px);
            }
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 640px) {
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
            .modal-box {
                margin: 1rem;
                max-height: 85vh;
            }
            .toast-container {
                right: 12px;
                left: 12px;
                max-width: none;
                bottom: 12px;
            }
        }

        /* 滚动条美化 for modal */
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .dark .modal-box::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* 选中高亮 */
        .highlight-match {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
        .dark .highlight-match {
            background: #a16207;
            color: #fef9c3;
        }

        /* 按钮通用 */
        .btn-primary {
            background: #4F46E5;
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.25s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
        }
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.25s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
        }
        .dark .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
            transform: translateY(-1px);
        }
        .dark .btn-secondary:hover {
            background: #475569;
        }
        .btn-danger {
            background: #EF4444;
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.25s;
            border: none;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: #4F46E5;
            border: 1.5px solid #4F46E5;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.25s;
            cursor: pointer;
        }
        .dark .btn-outline {
            color: #818CF8;
            border-color: #818CF8;
        }
        .btn-outline:hover {
            background: #4F46E5;
            color: #fff;
        }
        .dark .btn-outline:hover {
            background: #818CF8;
            color: #0f172a;
        }

        /* ===== 光阴の侧边栏（与 index.html / study-record.html 同款） ===== */
        .app-shell { display: flex; min-height: calc(100vh - 0px); }
        .app-main { flex: 1; min-width: 0; padding: 0 20px 0 480px; transition: padding-left .3s; }
        body.sidebar-collapsed .app-main { padding-left: 20px; }
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: 460px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #cbd5e1;
            z-index: 200;
            display: flex; flex-direction: column;
            transition: transform .3s cubic-bezier(.4,0,.2,1), width .3s;
            box-shadow: 4px 0 20px rgba(0,0,0,0.08);
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        .sidebar-inner { flex: 1; overflow-y: auto; padding: 16px 0 24px 0; scrollbar-width: thin; scrollbar-color: #475569 transparent; }
        .sidebar-inner::-webkit-scrollbar { width: 4px; }
        .sidebar-inner::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .sidebar-header { padding: 18px 18px 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; }
        .sidebar-header .logo-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); flex: none; }
        .sidebar-header .meta { flex: 1; min-width: 0; }
        .sidebar-header .title { font-size: 16px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-header .sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .sidebar-section { padding: 14px 14px 4px 14px; }
        .sidebar-section-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; padding: 0 8px 8px 8px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-section-title .manage-btn { font-size: 11px; color: #94a3b8; background: rgba(255,255,255,0.08); border: none; border-radius: 6px; padding: 3px 10px; cursor: pointer; text-transform: none; letter-spacing: 0; }
        .sidebar-section-title .manage-btn:hover { background: rgba(255,255,255,0.16); color: #f1f5f9; }
        .sidebar-list { list-style: none; padding: 0; margin: 0; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; color: #cbd5e1; font-size: 14px; user-select: none; position: relative; }
        .sidebar-item:hover { background: rgba(255,255,255,0.06); color: #f1f5f9; }
        .sidebar-item.active { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(99,102,241,0.35); }
        .sidebar-item .ico { font-size: 18px; flex: none; width: 24px; text-align: center; }
        .sidebar-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-item .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; flex: none; background: rgba(255,255,255,0.1); color: #cbd5e1; }
        .sidebar-item.active .badge { background: rgba(255,255,255,0.25); color: #fff; }
        .sidebar-footer { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 6px; }
        .sidebar-sync-btn { width: 100%; background: rgba(14,165,233,0.15); color: #7dd3fc; border: 1px solid rgba(14,165,233,0.35); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .sidebar-sync-btn:hover { background: rgba(14,165,233,0.28); color: #fff; border-color: rgba(14,165,233,0.6); }
        .sidebar-user-btn { width: 100%; background: rgba(124,58,237,0.15); color: #c4b5fd; border: 1px solid rgba(124,58,237,0.35); border-radius: 8px; padding: 8px 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .sidebar-user-btn:hover { background: rgba(124,58,237,0.28); color: #fff; border-color: rgba(124,58,237,0.6); }
        .sidebar-theme-btn { width: 100%; background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); border-radius: 8px; padding: 8px 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .sidebar-theme-btn:hover { background: rgba(245,158,11,0.28); color: #fff; border-color: rgba(245,158,11,0.6); }
        .sidebar-version { text-align: center; font-size: 11px; color: #64748b; margin-top: 2px; }
        /* dark 模式下 select 下拉背景与暗色风格一致 */
        body.dark select option,
        html.dark select option { background: #1e293b; color: #f1f5f9; }
        body.dark select option:checked,
        html.dark select option:checked { background: #4338ca; color: #fff; }
        /* 汉堡：贴侧栏左缘居中，可"隐身" */
        .sidebar-toggle {
            position: fixed; left: 0; top: 50%;
            transform: translateY(-50%);
            width: 22px; height: 56px;
            border-radius: 0 10px 10px 0;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff; border: none;
            font-size: 14px; line-height: 1; cursor: pointer;
            box-shadow: 2px 0 12px rgba(99,102,241,.4);
            z-index: 250;
            display: flex; align-items: center; justify-content: center;
            padding-left: 2px;
            writing-mode: vertical-rl; letter-spacing: 1px;
            transition: width .25s, padding-left .25s, transform .3s, opacity .2s;
        }
        .sidebar-toggle:hover { width: 26px; padding-left: 3px; }
        .sidebar-toggle:active { transform: translateY(-50%) scale(.96); }
        /* 汉堡一直显示：无隐身逻辑 */
        /* ===== 下拉选项管理按钮（地点 / 渠道 / 沟通类型） ===== */
        .eq-opt-mgr-btn {
            background: rgba(99,102,241,0.1);
            color: #4F46E5;
            border: none;
            font-size: 12px;
            padding: 1px 6px;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.4;
            transition: background .15s;
        }
        .eq-opt-mgr-btn:hover { background: rgba(99,102,241,0.22); color: #3730a3; }
        .dark .eq-opt-mgr-btn { color: #a5b4fc; background: rgba(129,140,248,0.12); }
        .dark .eq-opt-mgr-btn:hover { background: rgba(129,140,248,0.28); }
        /* 选项管理 modal */
        #eq-opt-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 99999; align-items: center; justify-content: center; }
        #eq-opt-modal.show { display: flex; }
        #eq-opt-modal .eq-opt-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 480px; width: 92vw; max-height: 86vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .dark #eq-opt-modal .eq-opt-box { background: #1e293b; color: #e2e8f0; }
        #eq-opt-modal .eq-opt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        #eq-opt-modal .eq-opt-title { font-size: 17px; font-weight: 700; }
        #eq-opt-modal .eq-opt-x { background: none; border: none; font-size: 22px; color: #94a3b8; cursor: pointer; line-height: 1; padding: 0 4px; }
        #eq-opt-modal .eq-opt-x:hover { color: #475569; }
        #eq-opt-modal .eq-opt-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        #eq-opt-modal .eq-opt-tab { padding: 6px 14px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
        #eq-opt-modal .eq-opt-tab.active { background: linear-gradient(135deg, #4F46E5 0%, #7c3aed 100%); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
        .dark #eq-opt-modal .eq-opt-tab { background: #334155; border-color: #475569; color: #cbd5e1; }
        .dark #eq-opt-modal .eq-opt-tab.active { color: #fff; }
        #eq-opt-modal .eq-opt-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 80px; padding: 12px; background: #f8fafc; border-radius: 10px; }
        .dark #eq-opt-modal .eq-opt-list { background: #0f172a; }
        #eq-opt-modal .eq-opt-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 16px; font-size: 13px; color: #1e293b; }
        .dark #eq-opt-modal .eq-opt-chip { background: #1e293b; border-color: #475569; color: #e2e8f0; }
        #eq-opt-modal .eq-opt-chip .x { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
        #eq-opt-modal .eq-opt-chip .x:hover { color: #ef4444; }
        #eq-opt-modal .eq-opt-add { display: flex; gap: 8px; }
        #eq-opt-modal .eq-opt-add input { flex: 1; min-width: 0; padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; background: #fff; color: #1e293b; }
        .dark #eq-opt-modal .eq-opt-add input { background: #1e293b; border-color: #475569; color: #e2e8f0; }
        #eq-opt-modal .eq-opt-add input:focus { border-color: #4F46E5; }
        #eq-opt-modal .eq-opt-add button { padding: 8px 16px; background: #4F46E5; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #eq-opt-modal .eq-opt-add button:hover { background: #3730a3; }
        #eq-opt-modal .eq-opt-empty { color: #94a3b8; font-size: 13px; text-align: center; padding: 18px 0; }
        #eq-opt-modal .eq-opt-hint { font-size: 12px; color: #64748b; margin-bottom: 12px; }
        .dark #eq-opt-modal .eq-opt-hint { color: #94a3b8; }
        /* 移动端：侧栏变抽屉 */
        @media (max-width: 980px) {
            .sidebar { width: min(210px, 46vw); transform: none !important; box-shadow: 4px 0 24px rgba(0,0,0,0.25); }
            .sidebar.collapsed { transform: translateX(-105%) !important; }
            .sidebar-header { padding: 12px 10px 10px 10px; }
            .sidebar-header .logo-icon { width: 34px; height: 34px; font-size: 17px; border-radius: 9px; }
            .sidebar-header .title { font-size: 13px; }
            .sidebar-header .sub { font-size: 10px; }
            .sidebar-section { padding: 10px 8px 2px 8px; }
            .sidebar-section-title { font-size: 10px; padding: 0 6px 6px 6px; }
            .sidebar-item { padding: 8px 8px; gap: 6px; font-size: 12px; }
            .sidebar-item .ico { font-size: 14px; width: 18px; }

                <i class="fa fa-times"></i>

    <!-- ============================================================ -->
    <script>
        // =================================================================
        //  数据层（按学员隔离：communication_record_data::<学员名>）
        // =================================================================
        const BASE_STORAGE_KEY = "communication_record_data";
        let currentUser = null;   // 当前学员名（与侧边栏 child_account_current 同步）

        // 读取侧边栏（child-growth-assistant 学员管理）的学员列表与当前学员
        function getChildAccountList() {
            try { return JSON.parse(localStorage.getItem('child_account_list') || '[]'); } catch (e) { return []; }
        }
        function getChildAccountCurrent() {
            try { return localStorage.getItem('child_account_current') || ''; } catch (e) { return ''; }
        }
        function setChildAccountCurrent(name) {
            try { localStorage.setItem('child_account_current', name); } catch (e) {}
        }
        // 当前学员的存储 key
        function storageKeyFor(name) {
            return name ? (BASE_STORAGE_KEY + '::' + name) : BASE_STORAGE_KEY;
        }
        function loadUserData(name) {
            const key = storageKeyFor(name);
            try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
        }
        function saveUserData(name, list) {
            const key = storageKeyFor(name);
            localStorage.setItem(key, JSON.stringify(list));
        }

        // 学员切换：保存旧学员数据 → 读新学员数据 → 刷新界面
        function switchUser(name) {
            if (name === currentUser) return;
            if (currentUser) saveUserData(currentUser, recordList);   // 先落盘当前学员
            currentUser = name;
            setChildAccountCurrent(name);                              // 同步侧边栏
            recordList = loadUserData(name);
            renderAll();
            if (typeof renderOptSelects === 'function') renderOptSelects();
            if (name) showToast('已切换到学员：' + name, 'success');
            else showToast('未选择学员，使用本地默认数据', 'warning');
        }

        // 初始化：跟随侧边栏当前学员
        (function initUser() {
            const cur = getChildAccountCurrent();
            if (cur) {
                currentUser = cur;
                recordList = loadUserData(cur);
            } else {
                // 侧边栏还没选学员 → 用默认 key 兼容旧数据
                currentUser = null;
                recordList = JSON.parse(localStorage.getItem(BASE_STORAGE_KEY) || '[]');
            }
        })();

        // =================================================================
        //  DOM 引用
        // =================================================================
        const $ = (s, ctx = document) => ctx.querySelector(s);
        const $$ = (s, ctx = document) => [...ctx.querySelectorAll(s)];

        const els = {
            form: $('#recordForm'),
            editId: $('#editId'),
            formTitle: $('#formTitle'),
            time: $('#time'),
            place: $('#place'),
            target: $('#target'),
            relation: $('#relation'),
            channel: $('#channel'),
            talkType: $('#talkType'),
            goal: $('#goal'),
            otherInfo: $('#otherInfo'),
            selfInfo: $('#selfInfo'),
            conflict: $('#conflict'),
            result: $('#result'),
            tags: $('#tags'),
            eval: $('#eval'),
            improve: $('#improve'),
            isDone: $('#isDone'),

            list: $('#recordList'),
            total: $('#totalCount'),
            success: $('#successCount'),
            todo: $('#todoCount'),
            topTag: $('#topTag'),
            recordCount: $('#recordCount'),

            search: $('#searchInput'),
            filterResult: $('#filterResult'),
            filterRelation: $('#filterRelation'),
            clearFilters: $('#clearFilters'),
            sortToggle: $('#sortToggle'),
            sortLabel: $('#sortLabel'),

            tagList: $('#tagList'),
            newTagInput: $('#newTagInput'),
            addTagBtn: $('#addTagBtn'),

            modal: $('#detailModal'),
            modalContent: $('#modalContent'),
            modalClose: $('#modalClose'),

            themeToggle: $('#sidebarThemeBtn'),
            exportBtn: $('#exportBtn'),
            importBtn: $('#importBtn'),
            importFileInput: $('#importFileInput'),
            userSelect: $('#userSelect'),
            userSyncDot: $('#userSyncDot'),
        };

        // =================================================================
        //  状态
        // =================================================================
        let sortAsc = false; // false = 最新优先 (desc)
        let filteredList = [];
        const tagSet = new Set();

        // =================================================================
        //  学员选择器（与侧边栏「学员管理」同步）
        // =================================================================
        function renderUserSelect() {
            const accs = getChildAccountList();
            const cur = getChildAccountCurrent();
            if (!els.userSelect) return;
            const options = ['<option value="">未选择学员</option>']
                .concat(accs.map(function(n) {
                    return '<option value="' + n.replace(/"/g, '&quot;') + '"' + (n === cur ? ' selected' : '') + '>' + n + '</option>';
                }));
            els.userSelect.innerHTML = options.join('');
            els.userSelect.value = cur || '';
            // 同步状态点：当前学员与侧边栏一致 = 绿；未选/不一致 = 灰/黄
            if (els.userSyncDot) {
                const dot = els.userSyncDot;
                if (cur && currentUser === cur) { dot.style.background = '#22c55e'; dot.title = '已与侧边栏同步'; }
                else if (!cur && !currentUser) { dot.style.background = '#cbd5e1'; dot.title = '未选择学员'; }
                else { dot.style.background = '#f59e0b'; dot.title = '与侧边栏不一致'; }
            }
        }

        // 下拉切换 → 与侧边栏学员管理联动
        if (els.userSelect) {
            els.userSelect.addEventListener('change', function() {
                const name = this.value;
                if (name) switchUser(name);
                else {
                    // 选择「未选择学员」→ 回退默认 key
                    if (currentUser) saveUserData(currentUser, recordList);
                    currentUser = null;
                    setChildAccountCurrent('');
                    recordList = loadUserData(null);
                    renderAll();
                    showToast('已切回本地默认数据', 'warning');
                }
                renderUserSelect();
                if (typeof renderOptSelects === 'function') renderOptSelects();
            });
        }

        // 跨标签页同步：侧边栏（index.html）切换学员时，这里自动跟进
        window.addEventListener('storage', function(e) {
            if (!e.key) return;
            if (e.key === 'child_account_current' || e.key === 'child_account_list' || e.key === 'child_account_meta::' + currentUser) {
                const cur = getChildAccountCurrent();
                // 侧边栏切到了别的学员 → 切换本页数据
                if (e.key === 'child_account_current' && cur !== currentUser) {
                    if (currentUser) saveUserData(currentUser, recordList);
                    currentUser = cur || null;
                    recordList = loadUserData(currentUser);
                    renderAll();
                }
                renderUserSelect();
            }
        });

        // =================================================================
        //  Toast 系统
        // =================================================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = $('#toastContainer');
            const icons = {
                info: 'fa-info-circle',
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle'
            };
            const colors = {
                info: '#4F46E5',
                success: '#10B981',
                error: '#EF4444',
                warning: '#F59E0B'
            };
            const item = document.createElement('div');
            item.className = `toast-item ${type}`;
            item.innerHTML = `
                <i class="fa ${icons[type] || icons.info}" style="color:${colors[type] || colors.info}"></i>
                <span>${message}</span>
            `;
            container.appendChild(item);
            setTimeout(() => {
                item.classList.add('removing');
                setTimeout(() => item.remove(), 300);
            }, duration);
        }

        // =================================================================
        //  主题
        // =================================================================
        function initTheme() {
            // 新 key 'page_theme_v1' 优先；老 key 'theme' 兼容
            var saved = localStorage.getItem('page_theme_v1') || localStorage.getItem('theme');
            if (saved === 'dark') document.documentElement.classList.add('dark');
            else if (saved === 'light') document.documentElement.classList.remove('dark');
            else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }
        initTheme();

        els.themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            var isDark = document.documentElement.classList.contains('dark');
            try { localStorage.setItem('page_theme_v1', isDark ? 'dark' : 'light'); } catch (e) {}
        });
        // 跨标签页同步
        window.addEventListener('storage', (ev) => {
            if (ev.key === 'page_theme_v1') {
                var v = ev.newValue;
                if (v === 'dark') document.documentElement.classList.add('dark');
                else if (v === 'light') document.documentElement.classList.remove('dark');
            }
        });

        // =================================================================
        //  标签管理
        // =================================================================
        function loadTagSet() {
            tagSet.clear();
            recordList.forEach(r => {
                if (r.tags) {
                    r.tags.split(',').map(t => t.trim()).filter(Boolean).forEach(t => tagSet.add(t));
                }
            });
            // 确保预设标签存在
            const presets = ['急于反驳', '倾听不足', '表达模糊', '共情不足', '情绪急躁', '过度讨好', '边界不清'];
            presets.forEach(t => tagSet.add(t));
        }

        function renderTags() {
            loadTagSet();
            const sorted = [...tagSet].sort();
            els.tagList.innerHTML = sorted.map(t => `
                <span class="tag-pill" data-tag="${t}">
                    ${t}
                    <span class="del-tag" data-tag="${t}">×</span>
                </span>
            `).join('');

            // 点击标签 → 填入表单
            els.tagList.querySelectorAll('.tag-pill').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('del-tag')) return;
                    const tag = el.dataset.tag;
                    const current = els.tags.value.trim();
                    const arr = current ? current.split(',').map(s => s.trim()) : [];
                    if (!arr.includes(tag)) arr.push(tag);
                    els.tags.value = arr.join(', ');
                    els.tags.focus();
                });
                // 删除标签
                const del = el.querySelector('.del-tag');
                if (del) {
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const tag = del.dataset.tag;
                        // 从所有记录中移除该标签
                        let removed = false;
                        recordList.forEach(r => {
                            if (r.tags) {
                                const parts = r.tags.split(',').map(s => s.trim()).filter(Boolean);
                                const filtered = parts.filter(p => p !== tag);
                                if (filtered.length !== parts.length) {
                                    r.tags = filtered.join(', ');
                                    removed = true;
                                }
                            }
                        });
                        if (removed) {
                            saveLocal();
                            renderAll();
                            showToast(`已移除标签“${tag}”`, 'warning');
                        } else {
                            // 如果标签没有被使用，直接从tagSet移除
                            tagSet.delete(tag);
                            renderTags();
                        }
                    });
                }
            });
        }

        // 新增标签
        els.addTagBtn.addEventListener('click', () => {
            const val = els.newTagInput.value.trim();
            if (!val) return showToast('请输入标签名称', 'warning');
            if (tagSet.has(val)) return showToast('标签已存在', 'warning');
            tagSet.add(val);
            els.newTagInput.value = '';
            renderTags();
            showToast(`已添加标签“${val}”`, 'success');
        });
        els.newTagInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                els.addTagBtn.click(); }
        });

        // =================================================================
        //  渲染列表 & 统计
        // =================================================================
        function getFilteredAndSorted() {
            const search = els.search.value.trim().toLowerCase();
            const resultFilter = els.filterResult.value;
            const relationFilter = els.filterRelation.value;

            let list = [...recordList];

            // 搜索
            if (search) {
                list = list.filter(r =>
                    (r.target || '').toLowerCase().includes(search) ||
                    (r.goal || '').toLowerCase().includes(search) ||
                    (r.otherInfo || '').toLowerCase().includes(search) ||
                    (r.selfInfo || '').toLowerCase().includes(search) ||
                    (r.conflict || '').toLowerCase().includes(search) ||
                    (r.tags || '').toLowerCase().includes(search) ||
                    (r.place || '').toLowerCase().includes(search)
                );
            }

            // 筛选结果
            if (resultFilter) {
                list = list.filter(r => r.result === resultFilter);
            }
            // 筛选关系
            if (relationFilter) {
                list = list.filter(r => r.relation === relationFilter);
            }

            // 排序
            list.sort((a, b) => {
                const ta = a.time || '';
                const tb = b.time || '';
                if (sortAsc) return ta.localeCompare(tb);
                else return tb.localeCompare(ta);
            });

            return list;
        }

        function renderList() {
            filteredList = getFilteredAndSorted();
            const listWrap = els.list;

            if (filteredList.length === 0) {
                const hasFilter = els.search.value.trim() || els.filterResult.value || els.filterRelation.value;
                listWrap.innerHTML = `
                    <div class="text-center text-[#94A3B8] py-16 text-sm">
                        <i class="fa fa-inbox text-3xl block mb-3 opacity-30"></i>
                        ${hasFilter ? '没有匹配的记录' : '暂无记录，开始记录第一次沟通复盘'}
                    </div>
                `;
                return;
            }

            listWrap.innerHTML = filteredList.map((item, idx) => {
                const realIdx = recordList.indexOf(item);
                const timeStr = item.time ? item.time.replace('T', ' ').slice(0, 16) : '未知时间';
                const resultIcon = {
                    '目标达成': '✅',
                    '部分达成': '◐',
                    '未达成': '❌',
                    '恶化': '⚠️'
                } [item.result] || '📌';
                const doneBadge = item.isDone ?
                    '<span class="text-xs text-[#10B981] bg-[#D1FAE5] dark:bg-[#065F46] px-2 py-0.5 rounded-full font-medium">已落实</span>' :
                    '<span class="text-xs text-[#F59E0B] bg-[#FEF3C7] dark:bg-[#78350F] px-2 py-0.5 rounded-full font-medium">待练习</span>';

                return `
                    <div class="record-item" data-index="${realIdx}">
                        <div class="flex flex-wrap items-start justify-between gap-1">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-medium text-sm truncate">${item.target || '未命名'}</span>
                                    <span class="text-xs text-[#94A3B8] dark:text-[#64748B]">${item.relation || ''}</span>
                                    ${doneBadge}
                                </div>
                                <div class="text-xs text-[#94A3B8] dark:text-[#64748B] mt-0.5 flex items-center gap-2 flex-wrap">
                                    <span>${timeStr}</span>
                                    <span>${resultIcon} ${item.result || ''}</span>
                                    ${item.tags ? `<span class="text-[#8B5CF6]">🏷️ ${item.tags}</span>` : ''}
                                </div>
                                <div class="text-sm mt-1 line-clamp-1 text-[#475569] dark:text-[#CBD5E1]">
                                    ${item.goal ? '🎯 ' + item.goal : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-1 flex-shrink-0">
                                <button data-index="${realIdx}" class="edit-btn text-[#94A3B8] hover:text-primary transition p-1.5 rounded-lg hover:bg-[#F1F5F9] dark:hover:bg-[#1E293B]">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button data-index="${realIdx}" class="del-btn text-[#94A3B8] hover:text-danger transition p-1.5 rounded-lg hover:bg-[#F1F5F9] dark:hover:bg-[#1E293B]">
                                    <i class="fa fa-trash-o"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 事件绑定：编辑/删除/点击查看详情
            listWrap.querySelectorAll('.record-item').forEach(el => {
                const idx = +el.dataset.index;
                // 点击卡片 → 详情
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.edit-btn') || e.target.closest('.del-btn')) return;
                    showDetail(idx);
                });
            });

            listWrap.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editRecord(+btn.dataset.index);
                });
            });
            listWrap.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteRecord(+btn.dataset.index);
                });
            });

            els.recordCount.textContent = `(${filteredList.length})`;
        }

        function updateStats() {
            const total = recordList.length;
            const success = recordList.filter(r => r.result === '目标达成').length;
            const todo = recordList.filter(r => !r.isDone).length;

            els.total.textContent = total;
            els.success.textContent = success;
            els.todo.textContent = todo;

            // 高频标签
            const tagMap = {};
            recordList.forEach(r => {
                if (r.tags) {
                    r.tags.split(',').map(s => s.trim()).filter(Boolean).forEach(t => {
                        tagMap[t] = (tagMap[t] || 0) + 1;
                    });
                }
            });
            const sorted = Object.entries(tagMap).sort((a, b) => b[1] - a[1]);
            els.topTag.textContent = sorted[0]?.[0] || '暂无';
        }

        function renderAll() {
            renderList();
            updateStats();
            renderTags();
        }

        // =================================================================
        //  CRUD
        // =================================================================
        function saveLocal() {
            saveUserData(currentUser, recordList);
        }

        function resetForm() {
            els.form.reset();
            els.editId.value = '';
            els.formTitle.innerHTML = '<i class="fa fa-pencil-square-o text-primary"></i> 新增沟通记录';
            // 设置默认时间
            if (!els.time.value) {
                const now = new Date();
                els.time.value = now.toISOString().slice(0, 16);
            }
        }

        // 编辑
        function editRecord(idx) {
            const item = recordList[idx];
            if (!item) return;
            els.editId.value = idx;
            els.formTitle.innerHTML = '<i class="fa fa-edit text-warn"></i> 编辑记录';

            els.time.value = item.time || '';
            els.place.value = item.place || '';
            els.target.value = item.target || '';
            els.relation.value = item.relation || '同事';
            els.channel.value = item.channel || '线下当面';
            els.talkType.value = item.talkType || '闲聊';
            els.goal.value = item.goal || '';
            els.otherInfo.value = item.otherInfo || '';
            els.selfInfo.value = item.selfInfo || '';
            els.conflict.value = item.conflict || '';
            els.result.value = item.result || '目标达成';
            els.tags.value = item.tags || '';
            els.eval.value = item.eval || '';
            els.improve.value = item.improve || '';
            els.isDone.checked = !!item.isDone;

            // 滚动到表单
            els.form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => els.time.focus(), 300);
        }

        function deleteRecord(idx) {
            const item = recordList[idx];
            if (!item) return;
            if (!confirm(`确定删除“${item.target || '未命名'}”的沟通记录吗？`)) return;
            recordList.splice(idx, 1);
            saveLocal();
            renderAll();
            showToast('已删除记录', 'warning');
        }

        // 提交表单
        els.form.addEventListener('submit', (e) => {
            e.preventDefault();

            // 简单验证
            if (!els.time.value) {
                showToast('请选择发生时间', 'error');
                return;
            }

            const id = els.editId.value;
            const data = {
                time: els.time.value,
                place: els.place.value.trim(),
                target: els.target.value.trim(),
                relation: els.relation.value,
                channel: els.channel.value,
                talkType: els.talkType.value,
                goal: els.goal.value.trim(),
                otherInfo: els.otherInfo.value.trim(),
                selfInfo: els.selfInfo.value.trim(),
                conflict: els.conflict.value.trim(),
                result: els.result.value,
                tags: els.tags.value.trim(),
                eval: els.eval.value.trim(),
                improve: els.improve.value.trim(),
                isDone: els.isDone.checked
            };

            if (id !== '') {
                // 编辑
                recordList[+id] = data;
                showToast('记录已更新', 'success');
            } else {
                recordList.unshift(data);
                showToast('记录已保存', 'success');
            }

            saveLocal();
            resetForm();
            renderAll();
            // 自动设置新时间
            const now = new Date();
            els.time.value = now.toISOString().slice(0, 16);
        });

        // 取消编辑（通过重置）
        // 点击重置时，如果有editId，清除它
        document.addEventListener('click', (e) => {
            // 点击表单外部不会自动重置，但我们不提供重置按钮
        });

        // 快捷：点击"清空筛选"
        els.clearFilters.addEventListener('click', () => {
            els.search.value = '';
            els.filterResult.value = '';
            els.filterRelation.value = '';
            renderAll();
        });

        // 搜索/筛选变化
        els.search.addEventListener('input', renderAll);
        els.filterResult.addEventListener('change', renderAll);
        els.filterRelation.addEventListener('change', renderAll);

        // 排序切换
        els.sortToggle.addEventListener('click', () => {
            sortAsc = !sortAsc;
            els.sortLabel.textContent = sortAsc ? '最早优先' : '最新优先';
            renderAll();
        });

        // =================================================================
        //  详情弹窗
        // =================================================================
        function showDetail(idx) {
            const item = recordList[idx];
            if (!item) return;

            const timeStr = item.time ? item.time.replace('T', ' ').slice(0, 16) : '未知';
            const resultIcon = {
                '目标达成': '✅',
                '部分达成': '◐',
                '未达成': '❌',
                '恶化': '⚠️'
            } [item.result] || '📌';

            els.modalContent.innerHTML = `
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <div class="text-lg font-bold">${item.target || '未命名'}</div>
                        <div class="text-sm text-[#64748B] dark:text-[#94A3B8] flex flex-wrap items-center gap-2 mt-0.5">
                            <span>${timeStr}</span>
                            <span>·</span>
                            <span>${item.relation || ''}</span>
                            <span>·</span>
                            <span>${item.channel || ''}</span>
                            <span>·</span>
                            <span>${item.talkType || ''}</span>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="text-sm font-medium">${resultIcon} ${item.result || ''}</div>
                        ${item.isDone ? '<span class="text-xs text-[#10B981] bg-[#D1FAE5] dark:bg-[#065F46] px-2 py-0.5 rounded-full font-medium">✅ 已落实</span>' :
                            '<span class="text-xs text-[#F59E0B] bg-[#FEF3C7] dark:bg-[#78350F] px-2 py-0.5 rounded-full font-medium">⏳ 待练习</span>'}
                    </div>
                </div>

                <div class="border-t border-[#F1F5F9] dark:border-[#1E293B] my-3"></div>

                ${item.place ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">📍 地点：</span>${item.place}</div>` : ''}

                ${item.goal ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">🎯 目标：</span>${item.goal}</div>` : ''}

                ${item.otherInfo ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">👤 对方信息：</span>${item.otherInfo}</div>` : ''}

                ${item.selfInfo ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">🧑 自我信息：</span>${item.selfInfo}</div>` : ''}

                ${item.conflict ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">⚡ 卡点：</span>${item.conflict}</div>` : ''}

                ${item.tags ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">🏷️ 标签：</span><span class="text-[#8B5CF6]">${item.tags}</span></div>` : ''}

                ${item.eval ? `<div class="text-sm"><span class="font-medium text-[#64748B] dark:text-[#94A3B8]">📝 自我评价：</span>${item.eval}</div>` : ''}

                ${item.improve ? `<div class="text-sm p-3 bg-[#EEF2FF] dark:bg-[#1E1B4B] rounded-xl border border-[#C7D2FE] dark:border-[#312E81]"><span class="font-medium text-[#4F46E5] dark:text-[#818CF8]">🚀 改进方案：</span>${item.improve}</div>` : ''}

                <div class="flex gap-2 mt-2 pt-2 border-t border-[#F1F5F9] dark:border-[#1E293B]">
                    <button data-idx="${idx}" class="modal-edit-btn btn-primary !py-1.5 !px-4 text-sm">
                        <i class="fa fa-pencil"></i> 编辑
                    </button>
                    <button data-idx="${idx}" class="modal-del-btn btn-danger !py-1.5 !px-4 text-sm">
                        <i class="fa fa-trash"></i> 删除
                    </button>
                </div>
            `;

            // 弹窗内的编辑/删除
            els.modalContent.querySelector('.modal-edit-btn')?.addEventListener('click', () => {
                const idx = +els.modalContent.querySelector('.modal-edit-btn').dataset.idx;
                closeModal();
                editRecord(idx);
            });
            els.modalContent.querySelector('.modal-del-btn')?.addEventListener('click', () => {
                const idx = +els.modalContent.querySelector('.modal-del-btn').dataset.idx;
                closeModal();
                deleteRecord(idx);
            });

            els.modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            els.modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        els.modalClose.addEventListener('click', closeModal);
        els.modal.addEventListener('click', (e) => {
            if (e.target === els.modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // =================================================================
        //  导出 / 导入
        // =================================================================
        els.exportBtn.addEventListener('click', () => {
            if (recordList.length === 0) {
                return showToast('暂无数据可导出', 'warning');
            }
            const blob = new Blob([JSON.stringify(recordList, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            const uname = currentUser ? ('_' + currentUser) : '';
            a.download = `沟通复盘${uname}_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('导出成功', 'success');
        });

        els.importBtn.addEventListener('click', () => {
            els.importFileInput.click();
        });

        els.importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!Array.isArray(data)) throw new Error('数据格式错误');
                    if (data.length === 0) {
                        return showToast('导入文件为空', 'warning');
                    }
                    // 合并：去重（简单策略：替换全部）
                    if (confirm(`将导入 ${data.length} 条记录，是否覆盖当前所有数据？\n（点击"取消"则追加合并）`)) {
                        recordList = data;
                    } else {
                        // 追加，去重基于时间+目标 简单去重
                        const existingKeys = new Set(recordList.map(r => `${r.time}|${r.target}`));
                        let added = 0;
                        data.forEach(item => {
                            const key = `${item.time}|${item.target}`;
                            if (!existingKeys.has(key)) {
                                recordList.push(item);
                                existingKeys.add(key);
                                added++;
                            }
                        });
                        showToast(`追加了 ${added} 条新记录（跳过 ${data.length - added} 条重复）`, 'success');
                    }
                    saveLocal();
                    renderAll();
                    showToast(`导入成功，共 ${recordList.length} 条记录`, 'success');
                } catch (err) {
                    showToast('导入失败：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            els.importFileInput.value = '';
        });

        // =================================================================
        //  下拉选项管理：地点 / 渠道 / 沟通类型（按学员隔离，可增删改）
        // =================================================================
        const OPT_DEFAULTS = {
            place: ['办公室', '会议室', '家', '餐厅/咖啡厅', '微信', '电话', '线上会议', '路上', '其他'],
            channel: ['线下当面', '微信文字', '语音/电话', '视频会议', '邮件', '其他'],
            talkType: ['闲聊', '正式谈话', '汇报', '谈判协商', '安抚情绪', '争论分歧', '求助咨询', '道歉解释', '表扬感谢', '其他']
        };
        const OPT_LABELS = { place: '地点', channel: '渠道', talkType: '沟通类型' };

        function optKey(type) {
            const u = currentUser || '__default__';
            return 'eq_club_opt_' + type + '::' + u;
        }
        function getOptList(type) {
            try {
                const v = JSON.parse(localStorage.getItem(optKey(type)) || '[]');
                if (Array.isArray(v) && v.length) return v;
            } catch (e) {}
            return (OPT_DEFAULTS[type] || []).slice();
        }
        function saveOptList(type, list) {
            try { localStorage.setItem(optKey(type), JSON.stringify(list)); } catch (e) {}
        }
        function renderOptSelects() {
            ['place', 'channel', 'talkType'].forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                const cur = el.value;
                const list = getOptList(id);
                el.innerHTML = list.map(function (v) {
                    return '<option value="' + v.replace(/"/g, '&quot;') + '">' + v + '</option>';
                }).join('');
                if (cur && list.indexOf(cur) >= 0) el.value = cur;
            });
        }
        function addOpt(type, value) {
            value = (value || '').trim();
            if (!value) return false;
            const list = getOptList(type);
            if (list.indexOf(value) >= 0) return false;
            list.push(value);
            saveOptList(type, list);
            return true;
        }
        function delOpt(type, value) {
            let list = getOptList(type).filter(function (v) { return v !== value; });
            saveOptList(type, list);
        }

        // 选项管理 modal
        function ensureOptModal() {
            if (document.getElementById('eq-opt-modal')) return;
            const html =
                '<div id="eq-opt-modal" onclick="if(event.target===this)EqOptMgr.close()">' +
                  '<div class="eq-opt-box">' +
                    '<div class="eq-opt-head">' +
                      '<span class="eq-opt-title">⚙ 选项管理</span>' +
                      '<button class="eq-opt-x" type="button" onclick="EqOptMgr.close()" aria-label="关闭">×</button>' +
                    '</div>' +
                    '<div class="eq-opt-hint" id="eq-opt-hint">增删改你的下拉选项。下方 chip 旁的 × 删除；底栏输入新值 → 添加。当前学员切换后，选项自动跟随。</div>' +
                    '<div class="eq-opt-tabs" id="eq-opt-tabs">' +
                      '<button type="button" data-type="place" class="eq-opt-tab">📍 地点</button>' +
                      '<button type="button" data-type="channel" class="eq-opt-tab">📡 渠道</button>' +
                      '<button type="button" data-type="talkType" class="eq-opt-tab">💬 沟通类型</button>' +
                    '</div>' +
                    '<div class="eq-opt-list" id="eq-opt-list"></div>' +
                    '<div class="eq-opt-add">' +
                      '<input type="text" id="eq-opt-input" placeholder="输入新选项…" maxlength="30">' +
                      '<button type="button" id="eq-opt-addbtn">添加</button>' +
                    '</div>' +
                  '</div>' +
                '</div>';
            const wrap = document.createElement('div');
            wrap.innerHTML = html;
            document.body.appendChild(wrap.firstChild);
            // 事件
            document.querySelectorAll('#eq-opt-modal .eq-opt-tab').forEach(function (b) {
                b.addEventListener('click', function () { EqOptMgr.setType(b.getAttribute('data-type')); });
            });
            document.getElementById('eq-opt-addbtn').addEventListener('click', function () {
                const v = document.getElementById('eq-opt-input').value;
                if (EqOptMgr.addCurrent(v)) document.getElementById('eq-opt-input').value = '';
            });
            document.getElementById('eq-opt-input').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const v = e.target.value;
                    if (EqOptMgr.addCurrent(v)) e.target.value = '';
                }
            });
        }
        const EqOptMgr = {
            curType: 'place',
            open: function (type) {
                ensureOptModal();
                this.setType(type || 'place');
                document.getElementById('eq-opt-modal').classList.add('show');
                setTimeout(function () {
                    const inp = document.getElementById('eq-opt-input');
                    if (inp) inp.focus();
                }, 50);
            },
            close: function () {
                const m = document.getElementById('eq-opt-modal');
                if (m) m.classList.remove('show');
            },
            setType: function (type) {
                this.curType = type;
                document.querySelectorAll('#eq-opt-modal .eq-opt-tab').forEach(function (b) {
                    b.classList.toggle('active', b.getAttribute('data-type') === type);
                });
                this.renderList();
            },
            renderList: function () {
                const list = getOptList(this.curType);
                const wrap = document.getElementById('eq-opt-list');
                if (!list.length) {
                    wrap.innerHTML = '<div class="eq-opt-empty">（空，底栏输入添加）</div>';
                    return;
                }
                wrap.innerHTML = list.map(function (v) {
                    return '<span class="eq-opt-chip">' +
                        '<span>' + v.replace(/</g, '&lt;') + '</span>' +
                        '<button type="button" class="x" data-del="' + v.replace(/"/g, '&quot;') + '" title="删除">×</button>' +
                    '</span>';
                }).join('');
                wrap.querySelectorAll('[data-del]').forEach(function (b) {
                    b.addEventListener('click', function () {
                        delOpt(EqOptMgr.curType, b.getAttribute('data-del'));
                        EqOptMgr.renderList();
                        renderOptSelects();
                    });
                });
            },
            addCurrent: function (value) {
                if (!addOpt(this.curType, value)) {
                    if (typeof showToast === 'function') showToast('已存在或输入为空', 'warning');
                    return false;
                }
                this.renderList();
                renderOptSelects();
                if (typeof showToast === 'function') showToast('已添加：' + value, 'success');
                return true;
            }
        };

        // 绑定三个 ⚙ 按钮 + 切学员后刷新 select
        document.querySelectorAll('.eq-opt-mgr-btn').forEach(function (b) {
            b.addEventListener('click', function (e) {
                e.preventDefault();
                EqOptMgr.open(b.getAttribute('data-opt-type'));
            });
        });
        // 跨标签页同步（学员切换时 storage 事件触发）
        window.addEventListener('storage', function (e) {
            if (e.key === 'child_account_current' || e.key === 'child_account_list') {
                renderOptSelects();
            }
        });

        // =================================================================
        //  初始化
        // =================================================================
        function init() {
            // 设置默认时间
            const now = new Date();
            els.time.value = now.toISOString().slice(0, 16);

            renderUserSelect();
            renderOptSelects();
            renderAll();

            // 如果记录为空，显示提示
            if (recordList.length === 0) {
                // 可以添加示例数据？不自动添加，保持干净
            }

            // 控制台提示
            console.log('💬 沟通复盘系统已加载' + (currentUser ? '（学员：' + currentUser + '）' : '（未选择学员，使用默认数据）') + '，数据条数:', recordList.length);
        }

        init();

        // 暴露一些变量方便调试
        window.__debug = { recordList, renderAll, showToast };
    </script>

    <!-- 汉堡导航：贴侧栏左缘居中，一直显示。点 → 收起/展开侧栏 -->
    <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开侧栏" aria-label="收起/展开侧栏">☰</button>

    <script>
        // ============ 侧栏逻辑：渲染工具 / 折叠 / footer 按钮 + 跨标签页同步 ============
        (function() {
            'use strict';
            var TOOL_DEFS = [
                { key: 'main',  ico: '🌱', name: '儿童成长系统', href: './index.html' },
                { key: 'study', ico: '📚', name: '默认学员学习记录', href: './study-record.html' },
                { key: 'eq',    ico: '💬', name: '情商club',      href: './情商club.html' }
            ];
            function currentKey() {
                // pathname 可能是 URL 编码形式（%E6%83%85%E5%95%86club.html），先解码再比对
                var p = decodeURIComponent(window.location.pathname.split('/').pop() || 'index.html');
                if (p === 'study-record.html') return 'study';
                if (p === '情商club.html') return 'eq';
                return 'main';
            }
            function render() {
                var list = document.getElementById('sidebarTools');
                if (!list) return;
                var active = currentKey();
                list.innerHTML = TOOL_DEFS.map(function(t) {
                    var cls = 'sidebar-item' + (t.key === active ? ' active' : '');
                    var href = t.href || '#';
                    return '<li class="' + cls + '" data-href="' + href + '" data-key="' + t.key + '">' +
                        '<span class="ico">' + t.ico + '</span>' +
                        '<span class="name">' + t.name + '</span>' +
                        '<span class="badge">工具</span>' +
                    '</li>';
                }).join('');
                var n = document.getElementById('sidebarToolCount');
                if (n) n.textContent = TOOL_DEFS.length;
                var acc = '';
                try { acc = localStorage.getItem('child_account_current') || ''; } catch (e) {}
                var accEl = document.getElementById('sidebarAccount');
                if (accEl) accEl.textContent = acc || '未选择';
                list.querySelectorAll('.sidebar-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var href = el.getAttribute('data-href');
                        if (!href || href === '#') return;
                        var cur = window.location.pathname.split('/').pop();
                        if (href.split('/').pop() !== cur) window.location.href = href;
                    });
                });
            }
            // 折叠
            function bindToggle() {
                var sidebar = document.getElementById('appSidebar');
                var toggle = document.getElementById('sidebarToggle');
                var mask = document.getElementById('sidebarMask');
                if (!sidebar || !toggle) return;
                function apply(v) {
                    if (v) {
                        sidebar.classList.add('collapsed');
                        document.body.classList.add('sidebar-collapsed');
                        if (mask) mask.classList.add('show');
                    } else {
                        sidebar.classList.remove('collapsed');
                        document.body.classList.remove('sidebar-collapsed');
                        if (mask) mask.classList.remove('show');
                    }
                }
                if (localStorage.getItem('sidebar_collapsed_v3') === null) apply(false);
                else apply(localStorage.getItem('sidebar_collapsed_v3') === '1');
                toggle.addEventListener('click', function() {
                    var willOpen = sidebar.classList.contains('collapsed');
                    try { localStorage.setItem('sidebar_collapsed_v3', willOpen ? '0' : '1'); } catch (e) {}
                    apply(!willOpen);
                });
                if (mask) mask.addEventListener('click', function() {
                    try { localStorage.setItem('sidebar_collapsed_v3', '1'); } catch (e) {}
                    apply(true);
                });
            }
            // footer 按钮：云端同步 / 学员管理 → 直接打开 modal（学员管理已共享）
            function bindFooterActions() {
                var sync = document.getElementById('sidebarCloudSyncBtn');
                if (sync) sync.addEventListener('click', function() {
                    // 直接在子页打开云同步弹窗，不跳主页
                    if (typeof window.EqSyncManager === 'object' && window.EqSyncManager.open) {
                        window.EqSyncManager.open();
                    } else if (typeof showToast === 'function') {
                        showToast('云同步模块加载中…');
                    }
                });
                var userMgr = document.getElementById('sidebarUserManagerBtn');
                if (userMgr) userMgr.addEventListener('click', function() {
                    // 直接弹出 modal，不再跳页
                    if (window.AccountManager && typeof window.AccountManager.open === 'function') {
                        window.AccountManager.open();
                    } else if (typeof showToast === 'function') {
                        showToast('学员管理加载中…');
                    }
                });
            }
            // 汉堡一直显示（无隐身逻辑）
            // 跨标签页同步（学员切换后刷新顶栏账号名）
            window.addEventListener('storage', function (e) {
                if (!e.key) return;
                if (e.key === 'child_account_current' || e.key === 'child_account_list') {
                    var acc = '';
                    try { acc = localStorage.getItem('child_account_current') || ''; } catch (e2) {}
                    var accEl = document.getElementById('sidebarAccount');
                    if (accEl) accEl.textContent = acc || '未选择';
                }
            });
            render();
            bindToggle();
            bindFooterActions();
        })();
    </script>
