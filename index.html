<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="儿童成长助手 · 导航中心：成长复盘 / 学习记录 / 情商club / 时间统计" />
    <meta name="theme-color" content="#2563eb" />
    <title>儿童成长助手 · 导航中心</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray: #64748b;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 2px 15px #00000008;
        }
        body {
            background-color: #f1f5f9;
            color: var(--dark);
            line-height: 1.7;
            padding-bottom: 80px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            background: #fff;
            box-shadow: 0 2px 10px #00000010;
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 70px;
            padding: 12px 0;
            gap: 12px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }
        /* ============ 光阴の侧边栏 ============ */
        .app-shell { display: flex; min-height: calc(100vh - 70px); }
        .app-main { flex: 1; min-width: 0; padding: 0 20px 0 480px; transition: padding-left .3s; }
        body.sidebar-collapsed .app-main { padding-left: 20px; }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 460px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #cbd5e1;
            z-index: 200;
            display: flex;
            flex-direction: column;
            transition: transform .3s cubic-bezier(.4,0,.2,1), width .3s;
            box-shadow: 4px 0 20px rgba(0,0,0,0.08);
        }
        .sidebar.collapsed {
            transform: translateX(-100%);
        }
        .sidebar-inner {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0 24px 0;
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
        .sidebar-inner::-webkit-scrollbar { width: 4px; }
        .sidebar-inner::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .sidebar-header {
            padding: 18px 18px 16px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.4);
            flex: none;
        }
        .sidebar-header .meta { flex: 1; min-width: 0; }
        .sidebar-header .title {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-header .sub {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .sidebar-section {
            padding: 14px 14px 4px 14px;
        }
        .sidebar-section-title {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            padding: 0 8px 8px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-section-title .manage-btn {
            font-size: 11px;
            color: #94a3b8;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 6px;
            padding: 3px 10px;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }
        .sidebar-section-title .manage-btn:hover { background: rgba(255,255,255,0.16); color: #f1f5f9; }
        .sidebar-list { list-style: none; padding: 0; margin: 0; }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s, color .15s;
            color: #cbd5e1;
            font-size: 14px;
            user-select: none;
            position: relative;
        }
        .sidebar-item:hover {
            background: rgba(255,255,255,0.06);
            color: #f1f5f9;
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99,102,241,0.35);
        }
        .sidebar-item .drag-handle {
            font-size: 14px;
            color: #64748b;
            cursor: grab;
            flex: none;
            line-height: 1;
            user-select: none;
        }
        .sidebar-item:hover .drag-handle { color: #cbd5e1; }
        .sidebar-item .ico {
            font-size: 18px;
            flex: none;
            width: 24px;
            text-align: center;
        }
        .sidebar-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-item .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
            flex: none;
            background: rgba(255,255,255,0.1);
            color: #cbd5e1;
        }
        .sidebar-item.active .badge {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }
        .sidebar-item .badge.has-data {
            background: rgba(99,102,241,0.18);
            color: #a5b4fc;
        }
        .sidebar-item.active .badge.has-data {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }
        .sidebar-item .badge.no-data {
            background: rgba(100,116,139,0.2);
            color: #94a3b8;
        }
        .sidebar-item.dragging {
            opacity: 0.5;
            border: 1px dashed #6366f1;
        }
        .sidebar-item.drag-over {
            border-top: 2px solid #6366f1;
        }
        .sidebar-footer {
            padding: 10px 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar-sync-btn {
            width: 100%;
            background: rgba(14,165,233,0.15);
            color: #7dd3fc;
            border: 1px solid rgba(14,165,233,0.35);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            white-space: nowrap;
        }
        .sidebar-sync-btn:hover { background: rgba(14,165,233,0.28); color: #fff; border-color: rgba(14,165,233,0.6); }
        .sidebar-user-btn {
            width: 100%;
            background: rgba(124,58,237,0.15);
            color: #c4b5fd;
            border: 1px solid rgba(124,58,237,0.35);
            border-radius: 8px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .sidebar-user-btn:hover { background: rgba(124,58,237,0.28); color: #fff; border-color: rgba(124,58,237,0.6); }
        .sidebar-theme-btn {
            width: 100%;
            background: rgba(245,158,11,0.15);
            color: #fbbf24;
            border: 1px solid rgba(245,158,11,0.35);
            border-radius: 8px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .sidebar-theme-btn:hover { background: rgba(245,158,11,0.28); color: #fff; border-color: rgba(245,158,11,0.6); }
        /* dark 模式下 select 下拉背景：让浏览器原生 popup 与暗色风格一致 */
        body.dark select option,
        html.dark select option { background: #1e293b; color: #f1f5f9; }
        body.dark select option:checked,
        html.dark select option:checked { background: #4338ca; color: #fff; }
        .sidebar-version {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }
        /* 侧栏 Hamburger：贴在侧栏左缘垂直居中，一直显示
           - 默认位置：垂直 50% / 水平贴在 sidebar 左缘，半圈 tab 样式
           - .shifted / .collapsed-pos 保留以兼容旧 JS（变 no-op，不再决定位置） */
        .sidebar-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 56px;
            border-radius: 0 10px 10px 0;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 2px 0 12px rgba(99,102,241,.4);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width .25s, padding-left .25s, transform .3s;
            padding-left: 2px;
            writing-mode: vertical-rl;
            letter-spacing: 1px;
        }
        .sidebar-toggle:hover { width: 26px; padding-left: 3px; }
        .sidebar-toggle:active { transform: translateY(-50%) scale(.96); }

        /* 兼容旧 JS 增删的 class：原本用于控制位置，现在改为无副作用 */
        .sidebar-toggle.collapsed-pos,
        .sidebar-toggle.shifted,
        .sidebar-toggle.collapsed-pos.shifted { /* no-op */ }
        .sidebar-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 150;
        }
        .sidebar-mask.show { display: block; }
        @media (max-width: 980px) {
            .sidebar-mask.show { left: min(210px, 46vw); }
        }
        .account-pill {
            padding: 6px 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 999px;
            color: #cbd5e1;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .account-pill b { color: #f1f5f9; }
        @media (max-width: 980px) {
            .sidebar {
                width: min(210px, 46vw);
                transform: none !important;
                box-shadow: 4px 0 24px rgba(0,0,0,0.25);
            }
            .sidebar.collapsed { transform: translateX(-105%) !important; }
            .sidebar-header { padding: 12px 10px 10px 10px; }
            .sidebar-header .logo-icon { width: 34px; height: 34px; font-size: 17px; border-radius: 9px; }
            .sidebar-header .title { font-size: 13px; }
            .sidebar-header .sub { font-size: 10px; }
            .sidebar-section { padding: 10px 8px 2px 8px; }
            .sidebar-section-title { font-size: 10px; padding: 0 6px 6px 6px; }
            .sidebar-item { padding: 8px 8px; gap: 6px; font-size: 12px; }
            .sidebar-item .ico { font-size: 14px; width: 18px; }
            .sidebar-item .badge { font-size: 9px; padding: 1px 5px; }
            .sidebar-item .drag-handle { font-size: 11px; }
            .sidebar-footer { padding: 8px 10px; }
            .sidebar-footer .account-pill { font-size: 10px; padding: 4px 8px; }
            .sidebar-toggle, .sidebar-toggle.shifted { left: 0 !important; top: 50% !important; transform: translateY(-50%) !important; width: 20px; height: 48px; font-size: 12px; }
            .app-main { padding-left: 8px; }
            body.sidebar-collapsed .app-main { padding-left: 8px; }
        }
        .card {
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            margin: 20px 0;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .module {
            display: none;
        }
        .module.active {
            display: block;
        }
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 12px 24px;
            background: var(--success);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 12px #00000015;
            z-index: 999;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none; /* 提示气泡不拦截页面点击 */
        }
        .toast.show {
            opacity: 1;
        }
        /* ===== 云同步模块 ===== */
        .sync-nav-btn {
            position: relative;
            padding: 5px 14px !important;
            border: 1px solid var(--border) !important;
            border-radius: 20px !important;
            background: #fff !important;
            font-size: 13px !important;
            color: var(--primary) !important;
            margin-left: 4px;
        }
        .sync-nav-btn:hover {
            background: #eef2ff !important;
            color: var(--primary) !important;
        }
        .sync-nav-btn .sync-dot {
            display: none;
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            border: 2px solid #fff;
        }
        .sync-nav-btn .sync-dot.on {
            display: block;
        }
        .sync-status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 14px;
        }
        .sync-status-row .sync-state {
            font-weight: 600;
        }
        .sync-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .sync-actions .btn {
            flex: 1;
            min-width: 130px;
        }
        .sync-hint {
            font-size: 12px;
            color: var(--gray);
            background: var(--light);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .sync-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sync-last {
            font-size: 12px;
            color: var(--gray);
        }
        .sync-link-btn {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
            padding: 4px;
        }
        .sync-link-btn:hover {
            color: var(--primary);
        }
        .footer-bar {
            text-align: center;
            font-size: 12px;
            color: var(--gray);
            padding: 16px 0 40px;
        }
        .footer-bar .sync-tag {
            display: inline-block;
            background: #ecfdf5;
            color: #059669;
            border-radius: 12px;
            padding: 2px 10px;
            margin: 0 4px;
            font-size: 11px;
        }
        /* ===== 多儿童账户 ===== */
        .brand-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
        }
        .brand-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-toggle {
            display: none;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--primary);
            font-size: 20px;
            line-height: 1;
            border-radius: 10px;
            cursor: pointer;
            flex: none;
            transition: .15s;
        }
        .nav-toggle:hover {
            background: #eef2ff;
            border-color: var(--primary);
        }
        .nav-toggle.open {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .account-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all .15s;
            box-shadow: 0 1px 4px #0000000a;
        }
        .account-btn:hover {
            background: #eef2ff;
            border-color: var(--primary);
        }
        .account-rows {
            max-height: 300px;
            overflow: auto;
        }
        .account-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            background: var(--light);
        }
        .account-row .acc-ico {
            font-size: 18px;
            flex: none;
        }
        .account-row .acc-name {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
        }
        .account-row .acc-cur {
            font-size: 11px;
            background: #dcfce7;
            color: #15803d;
            border-radius: 10px;
            padding: 2px 8px;
        }
        .account-row .acc-act {
            display: flex;
            gap: 6px;
        }
        .account-row .acc-act button {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--gray);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: .15s;
        }
        .account-row .acc-act button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .account-row .acc-act button.acc-del:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .account-note {
            font-size: 12px;
            color: var(--gray);
            background: #fffbeb;
            border: 1px dashed #fcd34d;
            border-radius: 8px;
            padding: 10px 12px;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .account-empty {
            text-align: center;
            color: var(--gray);
            padding: 20px 0;
            font-size: 13px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-block {
            width: 100%;
            margin-top: 10px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-box .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray);
        }
        .modal-box .modal-close:hover {
            color: var(--dark);
        }
        .print-only {
            display: none;
        }
/* ============================================================
   深色模式补丁：修复「页面变色」仅第三个工具（情商club）生效的问题
   原因：三个工具均通过给 <html> 切换 .dark 类来换肤，但 index /
   study-record 页面缺少深色样式覆盖，故在此补一套与情商club
   （slate + indigo 设计语言）一致的规则。无需改动 JS 逻辑。
   ============================================================ */
html.dark,
html.dark body { background:#0f172a !important; color:#e2e8f0 !important; }

/* 顶栏 */
html.dark header { background:#1e293b !important; color:#e2e8f0 !important; box-shadow:0 2px 10px rgba(0,0,0,.45) !important; }

/* 侧边栏 */
html.dark .sidebar,
html.dark .sidebar-inner { background:#1e293b !important; color:#e2e8f0 !important; border-color:#334155 !important; }
html.dark .sidebar-header,
html.dark .sidebar-section,
html.dark .sidebar-section-title { border-color:#334155 !important; color:#94a3b8 !important; }
html.dark .sidebar-item { color:#cbd5e1 !important; }
html.dark .sidebar-item:hover { background:rgba(148,163,184,.12) !important; }
html.dark .sidebar-item.active { background:rgba(99,102,241,.20) !important; color:#fff !important; }
html.dark .sidebar-item .ico,
html.dark .sidebar-item .name,
html.dark .sidebar-account { color:inherit !important; }

    <script>
        /* ===== 多儿童账户存储层 =====
         * 模板类数据（目标库/指标库/计时类别等）多账户共享；
         * 记录类数据（时间记录/打卡/复盘/待办/里程碑等）按当前账户隔离。
         * 隔离规则：在存储键前加 "<账户名>::" 前缀。
         */
        var Storage = {
            _ACCOUNT_KEY: 'child_account_current',
            _LIST_KEY: 'child_account_list',
            // 需要按账户隔离的记录类键（daily_* 覆盖每日打卡/临时/签到动态键）
            _ISOLATED: /^(time_records|todos|timer_state_sm|growth_week_review|growth_month_review|growth_milestone|growth_month_days|growth_diary|growth_homework|daily_)/,
            cur: function() {
                try { return localStorage.getItem(Storage._ACCOUNT_KEY) || ''; } catch (e) { return ''; }
            },
            list: function() {
                try {
                    var v = JSON.parse(localStorage.getItem(Storage._LIST_KEY) || '[]');
                    return Array.isArray(v) ? v : [];
                } catch (e) { return []; }
            },
            saveList: function(list) {
                try { localStorage.setItem(Storage._LIST_KEY, JSON.stringify(list)); } catch (e) {}
            },
            rk: function(key) {
                var acc = Storage.cur();
                if (acc && Storage._ISOLATED.test(key)) return acc + '::' + key;
                return key;
            },
            set: function(key, val) {
                try {
                    localStorage.setItem(Storage.rk(key), JSON.stringify(val));
                    try { if (typeof window !== 'undefined' && window.refreshSidebar) window.refreshSidebar(); } catch(e) {}
                } catch (e) { console.warn(e); }
            },
            get: function(key) {
                try { var res = localStorage.getItem(Storage.rk(key)); return res ? JSON.parse(res) : null; } catch (e) { console.warn(
                        e); return null; }
            }
        };

        function showToast(text) {
            var toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 1800);
        }
    </script>
    <script>
    <script>
        /* ================================================================
         *  ☁️ 云端数据同步模块（GitHub Gist · 手动上传/下载）
         *  数据保存在浏览器 localStorage，通过私有 Gist 实现多设备备份恢复。
         *  使用：① 点击右上角「☁️ 云同步」→ 配置 Token（只需一次）
         *        ② 在「源头」设备上传，到其他设备下载，即可保持一致
         * ================================================================ */
        (function() {
            'use strict';

            var TOKEN_KEY = 'github_token';
            var GIST_ID_KEY = 'github_gist_id';
            var LAST_SYNC_KEY = 'sync_last_sync';
            var DIRTY_KEY = 'sync_dirty';
            var GIST_FILE = 'child-growth-assistant-sync.json';
            var GIST_DESC = '儿童成长助手-云端同步';
            var API = 'https://api.github.com';

            var token = localStorage.getItem(TOKEN_KEY) || '';
            var gistId = localStorage.getItem(GIST_ID_KEY) || '';
            var connected = false;
            var dirty = localStorage.getItem(DIRTY_KEY) === '1';

            function exKeys() {
                return [TOKEN_KEY, GIST_ID_KEY, LAST_SYNC_KEY, DIRTY_KEY, 'timer_state_sm'];
            }

            function showToastMsg(msg) {
                if (typeof showToast === 'function') showToast(msg);
            }

            /* ---------- GitHub API ---------- */
            function api(method, path, body) {
                var opts = { method: method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' } };
                if (body) opts.body = JSON.stringify(body);
                return fetch(API + path, opts).then(function(r) {
                    if (!r.ok) {
                        return r.json().then(function(e) {
                            throw new Error((e && e.message) || ('HTTP ' + r.status));
                        });
                    }
                    return r.json();
                });
            }

            function collectLocalData() {
                var data = {};
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (exKeys().indexOf(k) > -1) continue;
                    var v = localStorage.getItem(k);
                    if (v === null || v === '') continue;
                    data[k] = { value: v, timestamp: Date.now() };
                }
                return data;
            }

            function readGist() {
                if (!gistId) return Promise.resolve(null);
                return api('GET', '/gists/' + gistId).then(function(d) {
                    var f = d.files && d.files[GIST_FILE];
                    if (!f || !f.content) return null;
                    return JSON.parse(f.content);
                }).catch(function() { return null; });
            }

            function writeGist(payload) {
                var files = {};
                files[GIST_FILE] = { content: JSON.stringify(payload, null, 2) };
                if (!gistId) {
                    return api('POST', '/gists', { description: GIST_DESC, public: false, files: files }).then(function(d) {
                        gistId = d.id;
                        localStorage.setItem(GIST_ID_KEY, gistId);
                    });
                }
                return api('PATCH', '/gists/' + gistId, { files: files });
            }

            // 关键：两端复用同一个 Gist（按同名文件查找，优先有数据的）
            function findOrCreateGist() {
                return api('GET', '/gists?per_page=100').then(function(list) {
                    var best = null,
                        bestWith = null;
                    (list || []).forEach(function(g) {
                        if (!g.files || !g.files[GIST_FILE]) return;
                        var has = false;
                        try {
                            var j = JSON.parse(g.files[GIST_FILE].content || '');
                            has = !!(j && j.data && Object.keys(j.data).length > 0);
                        } catch (e) {}
                        if (!best || new Date(g.updated_at) > new Date(best.updated_at)) best = g;
                        if (has && (!bestWith || new Date(g.updated_at) > new Date(bestWith.updated_at))) bestWith = g;
                    });
                    var chosen = bestWith || best;
                    if (chosen) {
                        gistId = chosen.id;
                        localStorage.setItem(GIST_ID_KEY, gistId);
                        return gistId;
                    }
                    var emptyFiles = {};
                    emptyFiles[GIST_FILE] = { content: JSON.stringify({ version: 1, data: {}, updatedAt: Date.now() }, null, 2) };
                    return api('POST', '/gists', { description: GIST_DESC, public: false, files: emptyFiles }).then(function(d) {
                        gistId = d.id;
                        localStorage.setItem(GIST_ID_KEY, gistId);
                        return gistId;
                    });
                }).catch(function(e) {
                    if (gistId) return gistId;
                    throw e;
                });
            }

            /* ---------- 通用弹窗 ---------- */
            function makeMask(inner) {
                var mask = document.createElement('div');
                mask.className = 'modal-overlay';
                mask.style.display = 'flex';
                mask.style.zIndex = '2000';
                mask.innerHTML = '<div class="modal-box" style="max-width:460px;">' + inner + '</div>';
                document.body.appendChild(mask);
                return mask;
            }

            function showConfirm(title, message) {
                return new Promise(function(resolve) {
                    var mask = makeMask(
                        '<div class="modal-title"><span>' + title + '</span></div>' +
                        '<p style="font-size:14px;color:#475569;line-height:1.7;white-space:pre-wrap;margin:6px 0 20px;">' + message + '</p>' +
                        '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
                        '<button class="btn sync-cancel" style="background:#fff;color:#475569;border:1px solid var(--border);">取消</button>' +
                        '<button class="btn btn-primary sync-ok">确定覆盖</button>' +
                        '</div>'
                    );
                    var done = function(v) { mask.remove(); resolve(v); };
                    mask.querySelector('.sync-cancel').onclick = function() { done(false); };
                    mask.querySelector('.sync-ok').onclick = function() { done(true); };
                    mask.addEventListener('click', function(e) { if (e.target === mask) done(false); });
                });
            }

            function showAlertMsg(title, message) {
                return new Promise(function(resolve) {
                    var mask = makeMask(
                        '<div class="modal-title"><span>' + title + '</span></div>' +
                        '<p style="font-size:14px;color:#475569;line-height:1.7;white-space:pre-wrap;margin:6px 0 20px;">' + message + '</p>' +
                        '<div style="display:flex;justify-content:flex-end;"><button class="btn btn-primary sync-ok">知道了</button></div>'
                    );
                    mask.querySelector('.sync-ok').onclick = function() { mask.remove(); resolve(); };
                    mask.addEventListener('click', function(e) { if (e.target === mask) { mask.remove(); resolve(); } });
                });
            }

            function closeTopModal() {
                var m = document.querySelectorAll('.modal-overlay');
                for (var i = 0; i < m.length; i++) {
                    if (m[i].style.zIndex === '2000') m[i].remove();
                }
            }

            /* ---------- 状态 ---------- */
            function lastSyncText() {
                var ts = localStorage.getItem(LAST_SYNC_KEY);
                if (!ts) return '还没有同步过';
                try {
                    var d = new Date(Number(ts));
                    return '上次：' + d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                } catch (e) { return '上次同步过'; }
            }

            function markDirtyUI() {
                var dot = document.getElementById('syncDot');
                if (dot) dot.classList.toggle('on', dirty);
            }

            function markDirty() {
                dirty = true;
                try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {}
                markDirtyUI();
            }

            function markClean() {
                dirty = false;
                try { localStorage.removeItem(DIRTY_KEY); } catch (e) {}
                markDirtyUI();
            }

            /* ---------- 数据变更检测：包装 Storage.set ---------- */
            function wrapStorage() {
                function apply() {
                    if (typeof Storage !== 'object' || !Storage.set || Storage.set.__wrapped) return;
                    var orig = Storage.set;
                    Storage.set = function(k, v) {
                        orig(k, v);
                        if (exKeys().indexOf(k) === -1) markDirty();
                    };
                    Storage.set.__wrapped = true;
                }
                if (document.readyState === 'complete') apply();
                else window.addEventListener('load', apply);
            }

            /* ---------- 动作：上传 / 下载 ---------- */
            function doUpload() {
                if (!connected) { openConfig(); return; }
                closeTopModal();
                findOrCreateGist().then(function() {
                    return readGist();
                }).then(function(remote) {
                    var cloudHas = remote && remote.data && Object.keys(remote.data).length > 0;
                    var after = function() {
                        var payload = { version: 1, data: collectLocalData(), updatedAt: Date.now() };
                        return writeGist(payload).then(function() {
                            localStorage.setItem(LAST_SYNC_KEY, String(Date.now()));
                            markClean();
                            showToastMsg('✅ 已上传到云端！');
                        });
                    };
                    if (cloudHas) {
                        return showConfirm('上传将覆盖云端', '云端已存有数据。\n点「确定覆盖」会用【本机数据】替换云端。\n\n想保留云端就点「取消」。').then(function(ok) {
                            if (ok) return after();
                        });
                    }
                    return after();
                }).catch(function(e) {
                    console.warn('[同步] 上传失败:', e);
                    showAlertMsg('上传失败', '请检查网络和 Token 是否有效。\n' + (e.message || ''));
                });
            }

            function doDownload() {
                if (!connected) { openConfig(); return; }
                closeTopModal();
                findOrCreateGist().then(function() {
                    return readGist();
                }).then(function(remote) {
                    var sdata = (remote && remote.data) || {};
                    if (Object.keys(sdata).length === 0) {
                        return showAlertMsg('云端还没有数据', '请先在一部设备上点「上传到云端」，再来这里下载。');
                    }
                    return showConfirm('下载将覆盖本机', '云端数据会【替换本机当前数据】。\n点「确定覆盖」继续。\n\n想保留本机就点「取消」。').then(function(ok) {
                        if (!ok) return;
                        var keys = [];
                        for (var i = 0; i < localStorage.length; i++) {
                            var k = localStorage.key(i);
                            if (exKeys().indexOf(k) === -1) keys.push(k);
                        }
                        keys.forEach(function(k) { localStorage.removeItem(k); });
                        for (var key in sdata) {
                            if (exKeys().indexOf(key) > -1) continue;
                            var entry = sdata[key];
                            if (!entry || typeof entry.value !== 'string') continue;
                            localStorage.setItem(key, entry.value);
                        }
                        localStorage.setItem(LAST_SYNC_KEY, String(Date.now()));
                        markClean();
                        showToastMsg('✅ 数据已从云端恢复，正在刷新...');
                        setTimeout(function() { location.reload(); }, 1200);
                    });
                }).catch(function(e) {
                    console.warn('[同步] 下载失败:', e);
                    showAlertMsg('下载失败', '请检查网络和 Token 是否有效。\n' + (e.message || ''));
                });
            }

            /* ---------- 配置 Token ---------- */
            function openConfig() {
                closeTopModal();
                var mask = makeMask(
                    '<div class="modal-title"><span>⚙️ 配置云端同步</span><button class="modal-close sync-close">&times;</button></div>' +
                    '<p style="font-size:13px;color:var(--gray);margin-bottom:16px;">用 GitHub 私有 Gist 存储数据，免费、国内可访问。</p>' +
                    '<div class="form-item"><label>第 1 步：获取 Token</label>' +
                    '<a href="https://github.com/settings/tokens/new?description=child-growth-sync&scopes=gist" target="_blank" style="display:inline-block;padding:8px 14px;background:#24292e;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;">点击生成 GitHub Token</a>' +
                    '<div style="font-size:12px;color:var(--gray);margin-top:6px;">勾选「gist」权限，点最底部「Generate token」</div></div>' +
                    '<div class="form-item"><label>第 2 步：粘贴 Token</label>' +
                    '<input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" value="' + token + '" /></div>' +
                    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">' +
                    '<button class="btn sync-cancel" style="background:#fff;color:#475569;border:1px solid var(--border);">取消</button>' +
                    '<button class="btn btn-primary sync-save">保存并连接</button></div>'
                );
                mask.querySelector('.sync-cancel').onclick = function() { mask.remove(); };
                mask.querySelector('.sync-close').onclick = function() { mask.remove(); };
                mask.addEventListener('click', function(e) { if (e.target === mask) mask.remove(); });
                mask.querySelector('.sync-save').onclick = function() {
                    var val = mask.querySelector('#ghToken').value.trim();
                    if (!val) { alert('请先粘贴 Token'); return; }
                    token = val;
                    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
                    var btn = mask.querySelector('.sync-save');
                    btn.textContent = '连接中...';
                    btn.disabled = true;
                    findOrCreateGist().then(function() {
                        connected = true;
                        mask.remove();
                        showToastMsg('✅ 已连接云端，可以开始同步了');
                    }).catch(function(e) {
                        btn.textContent = '保存并连接';
                        btn.disabled = false;
                        alert('连接失败：' + (e.message || '网络错误'));
                    });
                };
            }

            /* ---------- 同步面板 ---------- */
            function openPanel() {
                closeTopModal();
                var stateTxt = connected ? '✅ 已连接云端' : '⚙️ 未配置（点击下方配置）';
                var lastTxt = lastSyncText();
                var dirtyTxt = dirty ? ' · <b style="color:var(--danger);">有未同步更改</b>' : '';
                var mask = makeMask(
                    '<div class="modal-title"><span>☁️ 云端数据同步</span><button class="modal-close sync-close">&times;</button></div>' +
                    '<div class="sync-status-row"><span class="sync-state">' + stateTxt + '</span><span class="sync-last" style="margin-left:auto;">' + lastTxt + '</span></div>' +
                    '<div style="font-size:12px;color:var(--gray);margin:-6px 0 12px;">' + dirtyTxt + '</div>' +
                    '<div class="sync-hint"><b>怎么用：</b><br>· <b>上传</b>：把这部设备的数据存到云端（覆盖云端）<br>· <b>下载</b>：把云端的数据恢复到本机（覆盖本机）<br>多设备保持一致：先在「源头」设备<b>上传</b>，再到其他设备<b>下载</b>。</div>' +
                    '<div class="sync-actions">' +
                    '<button class="btn btn-primary sync-up">⬆️ 上传到云端</button>' +
                    '<button class="btn btn-success sync-down">⬇️ 从云端下载</button>' +
                    '</div>' +
                    '<div class="sync-foot"><span class="sync-last">数据存在私有 Gist，仅自己可见</span>' +
                    '<button class="sync-link-btn sync-reconfig">重新配置 Token</button></div>'
                );
                mask.querySelector('.sync-close').onclick = function() { mask.remove(); };
                mask.querySelector('.sync-up').onclick = doUpload;
                mask.querySelector('.sync-down').onclick = doDownload;
                mask.querySelector('.sync-reconfig').onclick = openConfig;
                mask.addEventListener('click', function(e) { if (e.target === mask) mask.remove(); });
            }

            /* ---------- 初始化 ---------- */
            function init() {
                // PWA：注册 Service Worker（离线可用 + 可安装）
                if ('serviceWorker' in navigator && location.protocol === 'https:') {
                    // 加版本号防止浏览器 HTTP 缓存旧的 sw.js，确保 SW 更新能尽快下发
                    navigator.serviceWorker.register('sw.js?v=18').catch(function(e) {
                        console.warn('[SW] 注册失败:', e);
                    });
                }
                // 暴露到 window，让侧边栏的「☁️ 云端同步」按钮可直接调用，不再依赖顶部隐藏的 trigger
                window.openSyncPanel = openPanel;

                // 顶部云同步按钮已删除：此处不再绑定
                if (false) {
                    var navBtn = document.getElementById('syncNavBtn');
                    if (navBtn) {
                        navBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            openPanel();
                        });
                    }
                }
                markDirtyUI();
                wrapStorage();
                if (!token) return;
                findOrCreateGist().then(function() { connected = true; }).catch(function() { connected = false; });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
    </script>
    <script>
    <script>
        /* ================================================================
         *  👦 多儿童账户管理
         *  模板共享（目标库/指标库/计时类别），记录隔离（时间/打卡/复盘/待办/里程碑）
         * ================================================================ */
        (function() {
            'use strict';

            function $(id) { return document.getElementById(id); }

            function curAccount() { return Storage.cur(); }

            function accountList() { return Storage.list(); }

            function renderAccountName() {
                var el = $('accountName');
                if (!el) return;
                var c = curAccount();
                el.textContent = c || '选择儿童';
                var g = $('accountGrade');
                if (g) {
                    var grade = c ? (localStorage.getItem('child_account_meta::' + c) || '') : '';
                    g.textContent = grade ? '[' + grade + ']' : '';
                }
            }

            function openAccountModal() {
                renderAccountRows();
                var m = $('accountModal');
                if (m) m.classList.add('show');
            }

            window.closeAccountModal = function() {
                var m = $('accountModal');
                if (m) m.classList.remove('show');
            };

            function esc(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            // 获取儿童的年级（取自 child_account_meta::<name>）
            function getAccountGrade(name) {
                try { return localStorage.getItem('child_account_meta::' + name) || ''; } catch (e) { return ''; }
            }
            function setAccountGrade(name, grade) {
                try { if (grade) localStorage.setItem('child_account_meta::' + name, grade); else localStorage.removeItem('child_account_meta::' + name); } catch (e) {}
            }

            function renderAccountRows() {
                var wrap = $('accountRows');
                if (!wrap) return;
                var accs = accountList();
                var c = curAccount();
                if (accs.length === 0) {
                    wrap.innerHTML = '<div class="account-empty">还没有儿童账户，点下方「＋ 添加」创建第一个吧 👶</div>';
                    return;
                }
                var html = '';
                accs.forEach(function(n) {
                    var g = getAccountGrade(n);
                    var gradeTag = g ? '<span style="font-size:11px;background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:10px;margin-left:6px;">📘 ' + esc(g) + '</span>' : '';
                    html += '<div class="account-row">' +
                        '<span class="acc-ico">👦</span>' +
                        '<span class="acc-name">' + esc(n) + gradeTag + '</span>' +
                        (n === c ? '<span class="acc-cur">当前</span>' : '') +
                        '<span class="acc-act">' +
                        '<button onclick="editAccountGrade(\'' + esc(n).replace(/'/g, "\\'") + '\')" title="修改年级">📘</button>' +
                        (n === c ? '' : '<button onclick="switchAccount(\'' + esc(n).replace(/'/g, "\\'") + '\')">切换</button>') +
                        '<button class="acc-del" onclick="deleteAccount(\'' + esc(n).replace(/'/g, "\\'") + '\')">删除</button>' +
                        '</span></div>';
                });
                wrap.innerHTML = html;
            }

            // 年级学期工具（与学员学习系统同款：数字年级+学期 ↔ 中文）
            var CN_GRADES = ['一', '二', '三', '四', '五', '六'];
            function gradeToCn(num, sem) {
                var n = parseInt(num, 10);
                if (!n || n < 1 || n > 6) return '';
                return CN_GRADES[n - 1] + '年级' + (sem === '下' ? '下' : '上');
            }
            function cnToGrade(text) {
                var t = (text || '').trim();
                if (!t) return null;
                var idx = CN_GRADES.indexOf(t.charAt(0));
                if (idx < 0) {
                    var m = t.match(/^(\d+)/);
                    if (m) return { num: parseInt(m[1], 10), sem: t.indexOf('下') >= 0 ? '下' : '上' };
                    return null;
                }
                return { num: idx + 1, sem: t.indexOf('下') >= 0 ? '下' : '上' };
            }

            window.editAccountGrade = function(name) {
                var cur = getAccountGrade(name);
                var meta = cnToGrade(cur);
                var gradeSel = document.getElementById('editGradeSelect');
                var semSel = document.getElementById('editSemesterSelect');
                if (gradeSel) gradeSel.value = meta ? String(meta.num) : '';
                if (semSel) semSel.value = meta ? meta.sem : '上';
                var nameEl = document.getElementById('editGradeUserName');
                if (nameEl) nameEl.textContent = '儿童：' + name;
                window._editGradeAccountName = name;
                var m = document.getElementById('editGradeModal');
                if (m) m.classList.add('show');
            };

            window.closeEditGradeModal = function() {
                var m = document.getElementById('editGradeModal');
                if (m) m.classList.remove('show');
            };

            window.saveEditGrade = function() {
                var name = window._editGradeAccountName;
                if (!name) return;
                var gradeSel = document.getElementById('editGradeSelect');
                var semSel = document.getElementById('editSemesterSelect');
                var gradeNum = gradeSel ? gradeSel.value : '';
                var semester = (semSel && semSel.value) || '上';
                var gradeText = gradeNum ? gradeToCn(gradeNum, semester) : '';
                setAccountGrade(name, gradeText);
                closeEditGradeModal();
                renderAccountRows();
                renderAccountName();
                showToast('📘 年级已更新');
            };

            window.switchAccount = function(name) {
                try { localStorage.setItem('child_account_current', name); } catch (e) {}
                showToast('👦 已切换到：' + name);
                setTimeout(function() { location.reload(); }, 300);
            };

            window.addAccount = function() {
                var input = document.getElementById('newAccountName');
                var gradeSel = document.getElementById('newAccountGrade');
                var semSel = document.getElementById('newAccountSemester');
                var name = input ? input.value.trim() : '';
                if (!name) { alert('请输入儿童姓名'); return; }
                var accs = accountList();
                if (accs.indexOf(name) > -1) { alert('该儿童已存在'); return; }
                accs.push(name);
                Storage.saveList(accs);
                // 年级下拉 + 学期下拉 → 中文年级学期（如"三年级上"），与学员学习系统共享
                var gradeNum = gradeSel ? gradeSel.value : '';
                var semester = (semSel && semSel.value) || '上';
                var gradeText = gradeNum ? gradeToCn(gradeNum, semester) : '';
                if (gradeText) setAccountGrade(name, gradeText);
                try { localStorage.setItem('child_account_current', name); } catch (e) {}
                if (input) input.value = '';
                if (gradeSel) gradeSel.value = '';
                if (semSel) semSel.value = '上';
                showToast('✅ 已添加并切换到：' + name);
                setTimeout(function() { location.reload(); }, 300);
            };

            window.deleteAccount = function(name) {
                var accs = accountList();
                var curName = curAccount();
                if (!confirm('确定删除儿童「' + name + '」吗？\n其时间记录、每日打卡、复盘、待办、里程碑等数据将一并删除，且不可恢复！')) return;
                var prefix = name + '::';
                var toRemove = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k.indexOf(prefix) === 0) toRemove.push(k);
                }
                toRemove.forEach(function(k) { localStorage.removeItem(k); });
                accs = accs.filter(function(a) { return a !== name; });
                Storage.saveList(accs);
                if (curName === name) {
                    try { localStorage.removeItem('child_account_current'); } catch (e) {}
                    if (accs.length > 0) {
                        try { localStorage.setItem('child_account_current', accs[0]); } catch (e) {}
                    }
                }
                showToast('🗑️ 已删除儿童：' + name);
                setTimeout(function() { location.reload(); }, 300);
            };

            function init() {
                renderAccountName();
                var btn = $('accountBtn');
                if (btn) btn.addEventListener('click', openAccountModal);
                // 侧边栏：学员管理 / 云端同步按钮
                var sidebarUserBtn = document.getElementById('sidebarUserManagerBtn');
                if (sidebarUserBtn) sidebarUserBtn.addEventListener('click', openAccountModal);
                var sidebarSyncBtn = document.getElementById('sidebarCloudSyncBtn');
                if (sidebarSyncBtn) sidebarSyncBtn.addEventListener('click', function() {
                    // 直接在本页打开云同步弹窗，不跳子页
                    if (typeof window.openSyncPanel === 'function') {
                        window.openSyncPanel();
                    }
                });
                var modal = $('accountModal');
                if (modal) {
                    modal.addEventListener('click', function(e) {
                        if (e.target === modal) closeAccountModal();
                    });
                }
                // 修改年级学期弹窗：点击遮罩关闭
                var egModal = $('editGradeModal');
                if (egModal) {
                    egModal.addEventListener('click', function(e) {
                        if (e.target === egModal) closeEditGradeModal();
                    });
                }
                // 移动端：汉堡菜单
                var navToggle = $('navToggle');
                var navMenu = $('navMenu');
                if (navToggle && navMenu) {
                    navToggle.addEventListener('click', function() {
                        var isOpen = navMenu.classList.toggle('open');
                        navToggle.classList.toggle('open', isOpen);
                        navToggle.textContent = isOpen ? '✕' : '☰';
                    });
                    navMenu.querySelectorAll('a').forEach(function(a) {
                        a.addEventListener('click', function() {
                            navMenu.classList.remove('open');
                            navToggle.classList.remove('open');
                            navToggle.textContent = '☰';
                        });
                    });
                }
                // 不再自动弹出「添加儿童」弹窗，避免进入首页即被打扰；用户可点击导航栏「选择儿童 / 添加儿童」按钮主动打开
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();

        // ================================================================
        //  光阴の侧边栏（网页工具集：儿童成长系统 / 学习记录 / 后续扩展）
        // ================================================================
        (function() {
            'use strict';

            // 网页工具定义：后续新增网页工具只需在下面追加一条
            var TOOL_DEFS = [
                { key: 'nav',   ico: '🧭', name: '导航中心', href: './index.html' },
                { key: 'main',  ico: '🌱', name: '成长复盘', href: './成长复盘.html' },
                { key: 'study', ico: '📚', name: '儿童学习记录', href: './study-record.html' },
                { key: 'eq', ico: '💬', name: '情商club', href: './情商club.html' },
                { key: 'time', ico: '⏱️', name: '时间统计', href: './时间统计.html' }
            ];

            // 当前所在网页
            function currentKey() {
                var p = window.location.pathname.split('/').pop() || 'index.html';
                if (p === '成长复盘.html') return 'main';
                if (p === 'study-record.html') return 'study';
                if (p === '情商club.html') return 'eq';
                if (p === '时间统计.html') return 'time';
                if (p === 'index.html' || p === '') return 'nav';
                return 'nav';
            }

            function getOrder() {
                try {
                    var o = JSON.parse(localStorage.getItem('sidebar_order_v3') || 'null');
                    if (Array.isArray(o) && o.length) {
                        // 兼容旧排序：新加入的工具自动追加到末尾，避免老用户看不到新入口
                        var has = {};
                        o.forEach(function(k) { has[k] = true; });
                        TOOL_DEFS.forEach(function(t) { if (!has[t.key]) o.push(t.key); });
                        return o;
                    }
                } catch (e) {}
                return TOOL_DEFS.map(function(t) { return t.key; });
            }
            function setOrder(o) {
                try { localStorage.setItem('sidebar_order_v3', JSON.stringify(o)); } catch (e) {}
            }
            function isCollapsed() {
                // 首次访问默认展开；从第二次开始尊重用户的选择
                try {
                    var v = localStorage.getItem('sidebar_collapsed_v3');
                    if (v === null) return false; // 默认展开
                    return v === '1';
                } catch (e) { return false; }
            }
            function setCollapsed(v) {
                try { localStorage.setItem('sidebar_collapsed_v3', v ? '1' : '0'); } catch (e) {}
            }

            // 统计每个网页的数据量（用于「有数据 / 未使用」徽章）
            function getToolDataCount(key) {
                var total = 0;
                try {
                    if (key === 'main') {
                        // 汇总主系统的记录类数据
                        var acc = Storage.cur();
                        var rk = function(k) { return (acc && Storage._ISOLATED.test(k)) ? (acc + '::' + k) : k; };
                        ['time_records', 'todos', 'growth_diary', 'growth_homework', 'growth_milestone', 'growth_month_days'].forEach(function(k) {
                            try {
                                var v = JSON.parse(localStorage.getItem(rk(k)) || '[]');
                                total += Array.isArray(v) ? v.length : 0;
                            } catch (e) {}
                        });
                        // 补充：周/月复盘、目标、每日打卡
                        ['growth_week_review', 'growth_month_review', 'growth_goal'].forEach(function(k) {
                            try {
                                var v = JSON.parse(localStorage.getItem(rk(k)) || 'null');
                                if (v && Object.keys(v).length) total++;
                            } catch (e) {}
                        });
                    } else if (key === 'study') {
                        try { var u = JSON.parse(localStorage.getItem('studyUsers_v21') || '[]'); total = u.length; } catch (e) {}
                    }
                } catch (e) {}
                return total;
            }

            function makeItemHTML(tool, isActive) {
                var count = getToolDataCount(tool.key);
                var badge = count > 0
                    ? '<span class="badge has-data">有数据</span>'
                    : '<span class="badge no-data">未使用</span>';
                return '<li class="sidebar-item' + (isActive ? ' active' : '') + '" data-tool="' + tool.key + '" data-href="' + tool.href + '">' +
                    '<span class="drag-handle" title="拖动排序">⋮⋮</span>' +
                    '<span class="ico">' + tool.ico + '</span>' +
                    '<span class="name">' + tool.name + '</span>' +
                    badge +
                '</li>';
            }

            function render() {
                var order = getOrder();
                var map = {};
                TOOL_DEFS.forEach(function(t) { map[t.key] = t; });

                var toolsList = document.getElementById('sidebarTools');
                if (toolsList) {
                    var activeKey = currentKey();
                    toolsList.innerHTML = order.filter(function(k) { return map[k]; }).map(function(k) {
                        return makeItemHTML(map[k], k === activeKey);
                    }).join('');
                }

                var countEl = document.getElementById('sidebarToolCount');
                if (countEl) countEl.textContent = TOOL_DEFS.length;

                // 顶部账户名
                var acc = '';
                try { acc = localStorage.getItem('child_account_current') || ''; } catch (e) {}
                var accEl = document.getElementById('sidebarAccount');
                if (accEl) accEl.textContent = acc || '未选择';
            }

            // 暴露刷新接口给其他模块
            window.refreshSidebar = render;

            function bindItemEvents() {
                var toolsList = document.getElementById('sidebarTools');
                if (!toolsList) return;
                toolsList.addEventListener('click', function(e) {
                    var item = e.target.closest('.sidebar-item');
                    if (!item || item.querySelector('.drag-handle') === e.target) return;
                    var href = item.getAttribute('data-href');
                    if (href && window.location.pathname.split('/').pop() !== href.split('/').pop()) {
                        window.location.href = href;
                    } else {
                        showToast && showToast('当前就在此页面');
                    }
                });
            }

            // 拖拽排序（为后续更多网页工具预留）
            function bindDragSort() {
                var list = document.getElementById('sidebarTools');
                if (!list) return;
                var dragItem = null;
                list.addEventListener('mousedown', function(e) {
                    if (!e.target.classList.contains('drag-handle')) return;
                    var li = e.target.closest('.sidebar-item');
                    if (!li) return;
                    dragItem = li;
                    li.classList.add('dragging');
                });
                list.addEventListener('mouseup', function() {
                    if (dragItem) dragItem.classList.remove('dragging');
                    dragItem = null;
                    list.querySelectorAll('.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
                });
                list.addEventListener('mousemove', function(e) {
                    if (!dragItem) return;
                    var target = e.target.closest('.sidebar-item');
                    if (!target || target === dragItem) return;
                    list.querySelectorAll('.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
                    target.classList.add('drag-over');
                });
                list.addEventListener('mouseleave', function() {
                    if (dragItem) {
                        list.querySelectorAll('.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
                    }
                });
                list.addEventListener('mouseup', function(e) {
                    if (!dragItem) return;
                    var target = e.target.closest('.sidebar-item');
                    if (!target || target === dragItem) {
                        dragItem.classList.remove('dragging');
                        dragItem = null;
                        return;
                    }
                    var rect = target.getBoundingClientRect();
                    var after = (e.clientY - rect.top) > rect.height / 2;
                    target.parentNode.insertBefore(dragItem, after ? target.nextSibling : target);
                    dragItem.classList.remove('dragging');
                    target.classList.remove('drag-over');
                    dragItem = null;

                    // 持久化新顺序
                    var newOrder = Array.from(list.querySelectorAll('.sidebar-item')).map(function(li) { return li.getAttribute('data-tool'); });
                    setOrder(newOrder);
                });
            }

            // 侧栏展开/收起
            function bindToggle() {
                var sidebar = document.getElementById('appSidebar');
                var toggle = document.getElementById('sidebarToggle');
                var mask = document.getElementById('sidebarMask');
                if (!sidebar || !toggle) return;

                var isMobile = function() { return window.innerWidth <= 980; };

                function apply(v) {
                    if (v) {
                        sidebar.classList.add('collapsed');
                        document.body.classList.add('sidebar-collapsed');
                        toggle.classList.add('collapsed-pos');
                        toggle.setAttribute('aria-label', '展开侧边栏');
                        if (mask) mask.classList.remove('show');
                    } else {
                        sidebar.classList.remove('collapsed');
                        document.body.classList.remove('sidebar-collapsed');
                        toggle.classList.remove('collapsed-pos');
                        toggle.setAttribute('aria-label', '收起侧边栏');
                        if (isMobile() && mask) mask.classList.add('show');
                        else if (mask) mask.classList.remove('show');
                    }
                }

                // 首次访问（未写过 cookie）→ 默认展开，不写入 localStorage
                var firstTime = localStorage.getItem('sidebar_collapsed_v3') === null;
                if (firstTime) apply(false);
                else apply(isCollapsed());

                toggle.addEventListener('click', function() {
                    var willOpen = sidebar.classList.contains('collapsed');
                    setCollapsed(!willOpen);
                    apply(!willOpen);
                });

                if (mask) mask.addEventListener('click', function() {
                    setCollapsed(true);
                    apply(true);
                });

                // 移动端：选择工具后自动收起让位给内容
                if (isMobile()) {
                    document.addEventListener('click', function(e) {
                        var item = e.target.closest ? e.target.closest('.sidebar-item') : null;
                        if (item) {
                            setTimeout(function() {
                                setCollapsed(true);
                                apply(true);
                            }, 120);
                        }
                    });
                }
            }

            // 管理（占位：后续可加入更多工具说明）
            var manageBtn = document.getElementById('sidebarManageBtn');
            if (manageBtn) manageBtn.addEventListener('click', function() {
                showToast && showToast('📌 当前 ' + TOOL_DEFS.length + ' 个网页工具，拖动 ⋮⋮ 可调整顺序');
            });

            function init() {
                render();
                bindItemEvents();
                bindDragSort();
                bindToggle();
                bindFooterActions();
            }

            // 侧边栏底部功能入口（始终显示）：云同步 / 学员管理
            function bindFooterActions() {
                var cloudSyncBtn = document.getElementById('sidebarCloudSyncBtn');
                if (cloudSyncBtn) cloudSyncBtn.addEventListener('click', function() {
                    if (typeof window.openSyncPanel === 'function') {
                        window.openSyncPanel();
                    } else {
                        // 兜底：模块尚未初始化时给个提示
                        if (typeof showToast === 'function') showToast('同步模块还在加载，请稍后再试');
                    }
                });
                var userMgrBtn = document.getElementById('sidebarUserManagerBtn');
                if (userMgrBtn) userMgrBtn.addEventListener('click', function() {
                    var acc = document.getElementById('accountBtn');
                    if (acc) acc.click();
                });
                // 页面变色（深/浅切换）：写到 localStorage 并切换 <html class="dark">
                var themeBtn = document.getElementById('sidebarThemeBtn');
                if (themeBtn) {
                    // 兼容新 key 'page_theme_v1' 与老 key 'theme'
                    var saved = null;
                    try { saved = localStorage.getItem('page_theme_v1') || localStorage.getItem('theme'); } catch (e) {}
                    if (saved === 'light') document.documentElement.classList.remove('dark');
                    else document.documentElement.classList.add('dark');
                    themeBtn.textContent = document.documentElement.classList.contains('dark') ? '🌙 页面变色' : '☀️ 页面变色';
                    themeBtn.addEventListener('click', togglePageTheme);
                }
                // 跨标签页同步（其它 tab 切了 → 这里立即跟随）
                window.addEventListener('storage', function(e) {
                    if (e.key === 'page_theme_v1' || e.key === 'theme') togglePageTheme(null, false);
                });
            }
            function togglePageTheme(btn, persist) {
                if (persist !== false) {
                    var willBeDark = !document.documentElement.classList.contains('dark');
                    try {
                        localStorage.setItem('page_theme_v1', willBeDark ? 'dark' : 'light');
                        localStorage.setItem('theme', willBeDark ? 'dark' : 'light');
                    } catch (e) {}
                }
                document.documentElement.classList.toggle('dark');
                var tb = document.getElementById('sidebarThemeBtn');
                if (tb) tb.textContent = document.documentElement.classList.contains('dark') ? '🌙 页面变色' : '☀️ 页面变色';
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 数据变化时刷新徽章（包括跨 tab 存储事件）
            window.addEventListener('storage', function() { render(); });
        })();
    </script>
    </script>
</body>
</html>
